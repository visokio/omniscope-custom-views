<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>

        #tooltip { position: absolute; display: none; pointer-events: none; z-index: 5; background: var(--panel); color: var(--ink); border: 1px solid var(--ring); border-radius: 6px; padding: 7px 10px; line-height: 1.45; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.15); }

    </style>

    <!-- Put SCRIPT tags to load 3rd party libraries here -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>

<div id="legend"></div>
<div id="tooltip"></div>
<div id="toolbar"><button id="resetBtn">Reset view</button><button id="spinBtn">Rotate</button></div>
<div id="message"></div>
