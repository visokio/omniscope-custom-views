<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { font-family: Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 12px; color: #f0efec; background: #0b0f1a; }
        #main { position: absolute; inset: 0; }
        #main canvas { display: block; outline: none; }
        #tooltip { position: absolute; display: none; pointer-events: none; z-index: 5; background: rgba(26,26,25,0.94); border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 7px 10px; line-height: 1.45; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
        #tooltip .k { color: #c3c2b7; }
        #legend { position: absolute; top: 8px; right: 8px; z-index: 4; background: rgba(26,26,25,0.82); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 6px 9px; max-height: calc(100% - 50px); overflow: auto; display: none; }
        #legend .t { color: #c3c2b7; font-weight: bold; margin-bottom: 3px; }
        #legend .it { display: flex; align-items: center; gap: 6px; padding: 1px 2px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
        #legend .it:hover { background: rgba(255,255,255,.08); }
        #legend .sw { width: 10px; height: 3px; border-radius: 2px; }
        #legend .v { margin-left: auto; padding-left: 10px; color: #898781; font-variant-numeric: tabular-nums; }
        #stats { position: absolute; left: 10px; top: 8px; z-index: 4; color: #c3c2b7; font-size: 11px; pointer-events: none; }
        #stats b { color: #f0efec; font-size: 15px; margin-right: 3px; }
        #toolbar { position: absolute; left: 8px; bottom: 8px; z-index: 4; display: flex; gap: 6px; }
        #toolbar button { font: inherit; font-size: 11px; color: #c3c2b7; background: rgba(26,26,25,0.82); border: 1px solid rgba(255,255,255,.14); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
        #toolbar button:hover { color: #fff; }
        #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #c3c2b7; font-size: 14px; padding: 20px; background: #0b0f1a; z-index: 6; }
    </style>

    <!-- Put SCRIPT tags to load 3rd party libraries here -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>

<body>
<div id="main"></div><!-- This element is where the view will render -->
<div id="stats"></div>
<div id="legend"></div>
<div id="tooltip"></div>
<div id="toolbar"><button id="resetBtn">Reset view</button><button id="spinBtn">Rotate</button></div>
<div id="message"></div>

<script src="/_global_/customview/v1/omniscope.js"></script><!-- Add the Omniscope custom view API -->

<script>
(function () {
    if (!omniscope || !omniscope.view) throw new Error("Omniscope chart API is not loaded");

    // ------------------------------------------------------------ scene (once)
    function init() {
        var main = document.getElementById("main");

        fetch(LAND_URL).then(function (r) { return r.json(); }).then(function (topo) {

            g.beginPath(); path(land); g.fillStyle = "#24446e"; g.fill(); g.lineWidth = 1.2; g.strokeStyle = "#4f74a6"; g.stroke();

            vertexShader: "varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
            fragmentShader: "varying vec3 vN; void main(){ float i = pow(0.75 - dot(vN, vec3(0.0,0.0,1.0)), 3.0); gl_FragColor = vec4(0.35,0.6,1.0,1.0) * i; }",
            side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true }));

        bindPointer(renderer.domElement);

        document.getElementById("spinBtn").addEventListener("click", function (e) { e.stopPropagation(); controls.autoRotate = !controls.autoRotate; });

    }
    function drawGraticule(g) {

        for (var lat = -60; lat <= 60; lat += 30) { var y = (90 - lat) / 180 * 1024; g.beginPath(); g.moveTo(0, y); g.lineTo(2048, y); g.stroke(); }
    }
    function aim() {
        if (!S.centre) return;
        var dir = vec(S.centre[0], S.centre[1], 1).normalize();
        S.camera.position.copy(dir.multiplyScalar(4.3)); S.controls.target.set(0, 0, 0); S.camera.lookAt(0, 0, 0); S.controls.update();
    }

    function textSprite(text) {
        var c = document.createElement("canvas"), g = c.getContext("2d"), f = "600 26px Lato, 'Segoe UI', Arial, sans-serif";
        g.font = f; var w = Math.ceil(g.measureText(text).width) + 12; c.width = w; c.height = 36;
        g.font = f; g.lineWidth = 5; g.strokeStyle = "rgba(11,15,26,0.9)"; g.strokeText(text, 6, 26); g.fillStyle = "#f0efec"; g.fillText(text, 6, 26);

    // ------------------------------------------------------------ data -> flows

        message(null);
        flows.sort(function (x, y) { return y.v - x.v; });
        var total = d3.sum(flows, function (f) { return f.v; }), maxN = Math.max(10, +it.maxFlows || 400), shown = flows.slice(0, maxN), vmax = shown[0].v || 1;
        // colour groups: top 8 origins (or destinations) by total flow; colour follows the place, not its rank in the current filter
        var by = it.colour ? "FIELD" : (it.colourBy || "ORIGIN"), key = function (f) { return by === "FIELD" ? String(f.cat) : by === "DESTINATION" ? f.d.key : f.o.key; };
        var totals = {}; flows.forEach(function (f) { totals[key(f)] = (totals[key(f)] || 0) + f.v; });
        var orderKey = by + "|" + (it.colour ? gf(it.colour) : "") + "|" + JSON.stringify(it.value ? [it.value.inputField, it.value.function] : null);
        if (!S.colourOrder || S.colourBy !== orderKey) { S.colourOrder = Object.keys(totals).sort(function (a, b) { return totals[b] - totals[a]; }); S.colourBy = orderKey; }
        Object.keys(totals).forEach(function (k) { if (S.colourOrder.indexOf(k) < 0) S.colourOrder.push(k); });
        var colourOf = function (f) { if (by === "SINGLE") return PAL[0]; var i = S.colourOrder.indexOf(key(f)); return i >= 0 && i < 8 ? PAL[i] : OTHER; };
        shown.forEach(function (f, i) {
            var a = vec(f.o.lat, f.o.lon, 1), b = vec(f.d.lat, f.d.lon, 1), ang = a.angleTo(b), h = 0.025 + 0.2 * ang / Math.PI, pts = [];
            for (var s = 0; s <= 40; s++) { var t = s / 40, p = slerp(a, b, ang, t); pts.push(p.multiplyScalar(1.002 + h * Math.sin(Math.PI * t))); }

            var mesh = new THREE.Mesh(new THREE.TubeGeometry(f.curve, 44, r, 5, false), new THREE.MeshBasicMaterial({ color: f.colour, transparent: true, opacity: 0.75, depthWrite: false }));

            f.pulse = i < 80 && it.animate !== false;
            if (f.pulse) { var pm = new THREE.Mesh(new THREE.SphereGeometry(r * 1.5 + 0.0032, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 })); f.pm = pm; f.phase = (i * 0.137) % 1; S.group.add(pm); }
        });
        // places
        var places = Object.keys(placeMap).map(function (k) { return placeMap[k]; }), pmax = d3.max(places, function (p) { return p.out + p.inn; }) || 1;
        places.forEach(function (p) {
            var r = 0.004 + 0.011 * Math.sqrt((p.out + p.inn) / pmax);
            var m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), new THREE.MeshBasicMaterial({ color: 0xf0efec }));
            m.position.copy(vec(p.lat, p.lon, 1.001)); m.userData = { place: p }; p.mesh = m; S.group.add(m);
        });
        places.sort(function (a, b) { return (b.out + b.inn) - (a.out + a.inn); });
        var nl = it.labels === undefined || it.labels === null ? 12 : +it.labels;
        places.slice(0, nl).forEach(function (p) { var s = textSprite(String(p.name)); s.position.copy(vec(p.lat, p.lon, 1.02)); p.label = s; S.group.add(s); });
        var isig = recs.length + "|" + JSON.stringify(it) + "|" + JSON.stringify(ctx.dataConfig.filter || null);
        if (isig !== S.introSig && !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) { S.intro = { t0: null, gap: Math.min(30, 1200 / Math.max(1, shown.length)) }; shown.forEach(function (f) { f.mesh.geometry.setDrawRange(0, 0); }); }
        S.introSig = isig;
        S.flows = shown; S.allFlows = flows; S.places = places; S.total = total;
        S.fields = { origin: gf(it.origin), destination: gf(it.destination), value: it.value ? (it.value.inputField || "Value") : null };

        }
        S.controls.autoRotate = !!it.autoRotate;
        restoreSelection(ctx); highlight(); legend(by, totals);
        document.getElementById("stats").innerHTML = '<b>' + fmt(total) + '</b>' + esc(S.fields.value || "flows") + ' across ' + flows.length.toLocaleString() + ' routes and ' + places.length + ' places' + (flows.length > shown.length ? ' (largest ' + shown.length + ' drawn)' : '');
    }
    function slerp(a, b, ang, t) {

        var s = Math.sin(ang), wa = Math.sin((1 - t) * ang) / s, wb = Math.sin(t * ang) / s;
        return new THREE.Vector3(a.x * wa + b.x * wb, a.y * wa + b.y * wb, a.z * wa + b.z * wb);
    }
    function legend(by, totals) {
        var el = document.getElementById("legend");
        if (by === "SINGLE") { el.style.display = "none"; return; }
        var keys = S.colourOrder.filter(function (k) { return totals[k]; }).slice(0, 8);
        var h = '<div class="t">' + esc(by === "FIELD" ? gf(omniscope.view.context().options.items.colour) : by === "DESTINATION" ? "Destination" : "Origin") + '</div>';
        keys.forEach(function (k) { var i = S.colourOrder.indexOf(k); h += '<div class="it" data-k="' + esc(k) + '"><span class="sw" style="background:' + (i < 8 ? PAL[i] : OTHER) + '"></span>' + esc(k) + '<span class="v">' + fmt(totals[k]) + '</span></div>'; });
        var rest = Object.keys(totals).filter(function (k) { return S.colourOrder.indexOf(k) >= 8; });
        if (rest.length) h += '<div class="it" style="cursor:default"><span class="sw" style="background:' + OTHER + '"></span>' + rest.length + ' others<span class="v">' + fmt(d3.sum(rest, function (k) { return totals[k]; })) + '</span></div>';
        el.innerHTML = h; el.style.display = "block";

        });

    // ------------------------------------------------------------ animation and label visibility
    function animate(now) {

        if (S.intro) { var I = S.intro, busy = false; if (I.t0 === null) I.t0 = now; // starts on the first frame drawn
            S.flows.forEach(function (f, i) { var g = f.mesh.geometry, n = g.index ? g.index.count : 0, k = Math.max(0, Math.min(1, (now - I.t0 - i * I.gap) / 900)); k = 1 - Math.pow(1 - k, 2); g.setDrawRange(0, k >= 1 ? Infinity : Math.floor(k * n / 30) * 30); if (k < 1) busy = true; }); if (!busy) S.intro = null; }
        S.flows.forEach(function (f) {

    // ------------------------------------------------------------ selection and highlight

    // ------------------------------------------------------------ pointer
    function bindPointer(canvas) {

        ray.params.Mesh = {};

            ray.setFromCamera(mouse, S.camera);
            var objs = S.places.map(function (p) { return p.mesh; }).concat(S.flows.map(function (f) { return f.mesh; }));
            var hits = ray.intersectObjects(objs, false), globeHit = ray.ray.intersectSphere(new THREE.Sphere(new THREE.Vector3(), 1), new THREE.Vector3());
            var gd = globeHit ? globeHit.distanceTo(S.camera.position) : Infinity;
            for (var i = 0; i < hits.length; i++) if (hits[i].distance <= gd + 0.01) return hits[i].object.userData;
            return null;
        }
        canvas.addEventListener("pointermove", function (ev) {
            pend = ev; requestAnimationFrame(function () {
                if (!pend) return; var e = pend; pend = null;
                var h = pick(e); if ((h && h.flow) !== (S.hover && S.hover.flow) || (h && h.place) !== (S.hover && S.hover.place)) { S.hover = h; highlight(); }
                tip(h, e); canvas.style.cursor = h ? "pointer" : "grab";
            });
        });
        canvas.addEventListener("pointerleave", function () { S.hover = null; highlight(); tip(null); });
        canvas.addEventListener("pointerdown", function (ev) { down = { x: ev.clientX, y: ev.clientY }; });
        canvas.addEventListener("pointerup", function (ev) {
            if (!down || ev.button !== 0) return; var moved = Math.abs(ev.clientX - down.x) + Math.abs(ev.clientY - down.y) > 5; down = null; if (moved) return;
            var h = pick(ev), add = ev.shiftKey || ev.ctrlKey || ev.metaKey;
            if (h && h.flow) selectFlow(h.flow, add); else if (h && h.place) selectPlace(h.place, "BOTH");
            else { S.selected = null; highlight(); omniscope.view.whitespaceClick(); }
        });
    }
    function tip(h, ev) {
        var el = document.getElementById("tooltip");
        if (!h) { el.style.display = "none"; return; }
        var lab = esc(S.fields.value || "Flows");
        if (h.flow) { var f = h.flow; el.innerHTML = '<b>' + esc(f.o.name) + ' &rarr; ' + esc(f.d.name) + '</b><br><span class="k">' + lab + ':</span> ' + fmt(f.v) + ' (' + (100 * f.v / S.total).toFixed(1) + '% of total)'; }
        else { var p = h.place; el.innerHTML = '<b>' + esc(p.name) + '</b><br><span class="k">Outbound:</span> ' + fmt(p.out) + '<br><span class="k">Inbound:</span> ' + fmt(p.inn); }
        el.style.display = "block";
        var x = ev.clientX + 14, y = ev.clientY + 14;
        if (x + el.offsetWidth > window.innerWidth - 4) x = ev.clientX - el.offsetWidth - 14;
        if (y + el.offsetHeight > window.innerHeight - 4) y = ev.clientY - el.offsetHeight - 14;
        el.style.left = Math.max(4, x) + "px"; el.style.top = Math.max(4, y) + "px";
    }
    window.__globe.selectFlow = function (i) { selectFlow(S.flows[i], false); };
    window.__globe.project = function (lat, lon) { var p = vec(lat, lon, 1).project(S.camera); var c = S.renderer.domElement.getBoundingClientRect(); return [(p.x + 1) / 2 * c.width, (1 - p.y) / 2 * c.height]; };

    omniscope.view.on(["load", "update"], render);
    omniscope.view.on("resize", function () {
        if (!S.renderer) return render();
        S.renderer.setSize(window.innerWidth, window.innerHeight); S.camera.aspect = window.innerWidth / Math.max(1, window.innerHeight); S.camera.updateProjectionMatrix();
    });
    document.body.addEventListener("click", function (e) { if (e.target === document.body || e.target.id === "message") omniscope.view.whitespaceClick(); });
})();
</script>
</body>
