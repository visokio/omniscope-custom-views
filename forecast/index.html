        // headline
        var head = svg.append("text").attr("x", m.l).attr("y", 16).style("font-size", "12.5px");
        head.append("tspan").style("font-weight", "bold").text(M.mname + ", next " + M.H + " " + UNITN[M.unit] + ": " + fmt(M.total));
        if (M.prev) head.append("tspan").attr("fill", "#52514e").text("  (" + pct(M.total / M.prev - 1) + " on the previous " + M.H + ")");
        // hover and click
        var cross = g.append("line").attr("y1", 0).attr("y2", h).attr("stroke", "#52514e").attr("opacity", 0);
        var allPts = H0.map(function (p) { return { p: p, hist: true }; }).concat(fut.map(function (p) { return { p: p, hist: false }; }));
        var nearest = function (ev) { var t = x.invert(d3.pointer(ev, g.node())[0]).getTime(), best = null; allPts.forEach(function (q) { if (!best || Math.abs(q.p.t - t) < Math.abs(best.p.t - t)) best = q; }); return best; };
        g.insert("rect", ":first-child").attr("class", "plot").attr("width", w).attr("height", h).attr("fill", "transparent").style("cursor", "pointer")
            .on("mousemove", function (ev) { var q = nearest(ev); cross.attr("x1", x(q.p.t)).attr("x2", x(q.p.t)).attr("opacity", 0.4); tipAt(q, ev); })
            .on("mouseleave", function () { cross.attr("opacity", 0); tip(); })
            .on("click", function (ev) { ev.stopPropagation(); var q = nearest(ev); if (q.hist) selectPeriod(q.p); else if (S.sel) publish(null, null); });
        if (intro) { linesIn(svg, 1100); }
        side();
    }

    function tipAt(q, ev) {
        var M = S.model, p = q.p, h = '<b>' + esc(M.label(new Date(p.t))) + '</b>';
        if (q.hist) { h += '<br><span class="k">Actual:</span> ' + fmt(p.v) + (p.filled ? ' <span class="k">(missing, interpolated)</span>' : ''); var b = M.bt && M.bt.pts.find(function (z) { return z.t === p.t; }); if (b) h += '<br><span class="k">Backtest forecast:</span> ' + fmt(b.v) + ' (' + pct(b.v / p.v - 1) + ')'; }
        else h += '<br><span class="k">Forecast:</span> <b>' + fmt(p.v) + '</b><br><span class="k">80% range:</span> ' + fmt(p.lo80) + ' to ' + fmt(p.hi80) + '<br><span class="k">95% range:</span> ' + fmt(p.lo95) + ' to ' + fmt(p.hi95);
        show(h, ev);
    }
    function side() {
        var M = S.model, el = document.getElementById("side"), f = M.fit;
        var model = (M.m > 1 ? (f.mult ? "multiplicative" : "additive") + " season of " + M.m + " " + UNITN[M.unit] : "no season") + (f.phi < 1 ? ", damped trend" : ", linear trend");
        var h = '<h3>Forecast</h3><div class="stat"><span class="big">' + fmt(M.total) + '</span><br>next ' + M.H + ' ' + UNITN[M.unit] + (M.prev ? ', ' + pct(M.total / M.prev - 1) + ' on the previous ' + M.H : '') + '</div>';
        if (M.bt) h += '<h3>Backtest</h3><div class="stat">Forecasting the last ' + M.bt.H + ' ' + UNITN[M.unit] + ' from the history before them: average error <b>' + (M.bt.mape * 100).toFixed(1) + '%</b>' + (M.bt.naive ? ' (repeating ' + (M.m > 1 ? 'the same ' + UNITN[M.unit].replace(/s$/, '') + ' a season earlier' : 'the last value') + ': ' + (M.bt.naive * 100).toFixed(1) + '%)' : '') + '.</div>';
        h += '<h3>Periods</h3><table><tr><th></th><th>Forecast</th><th>80% range</th></tr>';
        M.fut.forEach(function (p) { h += '<tr><td>' + esc(M.label(new Date(p.t))) + '</td><td>' + fmt(p.v) + '</td><td class="r">' + fmt(p.lo80) + ' to ' + fmt(p.hi80) + '</td></tr>'; });
        h += '</table><div class="note">Model: Holt-Winters exponential smoothing with ' + model + ', fitted to ' + M.series.length + ' ' + UNITN[M.unit] + ' of history' + (M.filled ? ', ' + M.filled + ' missing filled by interpolation' : '') + '. Ranges are approximate and assume the past pattern continues. Click a past period to select it.</div>';
        el.innerHTML = h;
    }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    function selectPeriod(p) {
        if (S.sel && S.sel.t === p.t) return publish(null, null);
        var M = S.model, F = M.F.d, lo = new Date(p.t).toISOString().slice(0, 10), hi = new Date(addUnit(p.t, M.unit, 1)).toISOString().slice(0, 10);
        publish({ type: "AND", filters: [{ type: "FIELD_VALUE", inputField: F, operator: ">=", value: lo }, { type: "FIELD_VALUE", inputField: F, operator: "<", value: hi }] }, { t: p.t });
    }
    window.__fc.selectIndex = function (i) { selectPeriod(S.model.series[i]); };

    document.getElementById("chart").addEventListener("click", function () { if (S.sel) publish(null, null); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
</body>
