<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 12px;
            line-height: 1.4;
            color: #8a8f9c;
        }
        #notice {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px 8px;
            box-sizing: border-box;
        }
        #notice.setup { color: #41475e; font-size: 13px; }
        #notice .title { font-weight: 600; }
    </style>
</head>

<body>
<div id="notice"></div>

<script src="/_global_/customview/v1/omniscope.js"></script><!-- Add the Omniscope custom view API -->

<script>
/* Mixpanel tracker: sends usage events for the report this view sits in to the Mixpanel project whose token is set
   in the view's settings. What is sent is listed in the README. Nothing is loaded or sent until a token is set. */

if (!omniscope || !omniscope.view) throw new Error("Omniscope chart API is not loaded");

// Mixpanel's JavaScript library, pinned (Apache-2.0): https://github.com/mixpanel/mixpanel-js
var MIXPANEL_LIB = "https://cdn.jsdelivr.net/npm/mixpanel-browser@2.84.0/dist/mixpanel.min.js";

/* Mixpanel's loader snippet (https://docs.mixpanel.com/docs/quickstart/install-mixpanel), unchanged except that it
   runs only once a token is set and loads the pinned library above. Calls made before the library arrives are
   queued and sent once it has loaded. */
function installMixpanel(src, onerror) {
(function(e,c){
  if(!c.__SV){
    var l,h;window.mixpanel=c;c._i=[];
    c.init=function(q,r,f){
      function t(d,a){
        var g=a.split(".");
        if(g.length==2){ d=d[g[0]]; a=g[1]; }
        d[a]=function(){
          d.push([a].concat(Array.prototype.slice.call(arguments,0)));
        };
      }
      var b=c;
      if(typeof f!=="undefined") b=c[f]=[];
      else f="mixpanel";
      b.people=b.people||[];
      b.toString=function(d){
        var a="mixpanel";
        if(f!=="mixpanel") a+="."+f;
        if(!d) a+=" (stub)";
        return a;
      };
      b.people.toString=function(){ return b.toString(1)+".people (stub)" };

      l="disable time_event track track_pageview track_links track_forms track_with_groups add_group set_group remove_group register register_once alias unregister identify name_tag set_config reset opt_in_tracking opt_out_tracking has_opted_in_tracking has_opted_out_tracking clear_opt_in_out_tracking start_batch_senders start_session_recording stop_session_recording people.set people.set_once people.unset people.increment people.append people.union people.track_charge people.clear_charges people.delete_user people.remove"
      .split(" ");

      for(h=0;h<l.length;h++) t(b, l[h]);

      var n="set set_once union unset remove delete".split(" ");
      b.get_group=function(){
        var a={}, g=["get_group"].concat(Array.prototype.slice.call(arguments,0));
        function d(p){
          a[p]=function(){
            b.push([g, [p].concat(Array.prototype.slice.call(arguments,0))]);
          };
        }
        for(var m=0;m<n.length;m++) d(n[m]);
        return a;
      };

      c._i.push([q,r,f]);
    };

    c.__SV=1.2;

    var k=e.createElement("script");
    k.type="text/javascript";
    k.async=true;
    k.src=src;
    k.onerror=onerror;
    var s=e.getElementsByTagName("script")[0];
    s.parentNode.insertBefore(k, s);
  }
})(document, window.mixpanel || []);
}

/* ============================================================
   Report, tab and element details for the events
   ============================================================ */

function extractReportName(url) {
    try {
        var u = new URL(url);
        var segments = u.pathname.split("/").filter(Boolean);
        if (!segments.length) return null;
        // A standalone report: /folder/name.ior[/...]
        var last = segments[segments.length - 1];
        if (/\.ior$/i.test(last)) return decodeURIComponent(last.replace(/\.ior$/i, ""));
        // A report in a project: .../Project.iox/er/ReportName/... or .../Project.iox/r/ReportName/...
        var iox = segments.findIndex(function(seg) { return /\.iox$/i.test(seg); });
        if (iox !== -1) {
            var mode = segments[iox + 1], report = segments[iox + 2];
            if (mode && /^(er|r)$/i.test(mode) && report) return decodeURIComponent(report);
        }
        return decodeURIComponent(last);
    } catch (e) {
        return null;
    }
}

function extractTabName(url) {
    var hash = url.split("#")[1];
    if (!hash) return null;
    try { return decodeURIComponent(hash.replace(/\+/g, " ")); } catch (e) { return hash; }
}

function getClassString(el) {
    if (!el || !el.className) return "";
    if (typeof el.className === "string") return el.className;
    if (typeof el.className.baseVal === "string") return el.className.baseVal;
    return String(el.className || "");
}

// Omniscope's names for the clicked element and its parents (data-aut-name), outermost first: "Tab > View > Item".
function getAutNamePath(target) {
    var names = [];
    for (var el = target; el; el = el.parentElement) {
        if (el.nodeType !== 1) continue;
        if (el.hasAttribute("data-aut-name")) names.push(el.getAttribute("data-aut-name"));
        getClassString(el).split(/\s+/).forEach(function(tok) {
            if (tok.indexOf("data-aut-name-") === 0 && tok.length > 14) names.push(tok.slice(14));
        });
    }
    names.reverse();
    return names.length ? names.join(" > ") : null;
}

// The data-* attributes of the innermost element (from the clicked one up) that has any.
function getInnermostDataAttrs(target) {
    for (var el = target; el; el = el.parentElement) {
        if (el.nodeType !== 1) continue;
        var attrs = {}, found = false;
        for (var i = 0; el.attributes && i < el.attributes.length; i++) {
            var a = el.attributes[i];
            if (a.name.indexOf("data-") === 0) { attrs[a.name] = a.value; found = true; }
        }
        getClassString(el).split(/\s+/).forEach(function(tok) {
            if (tok.indexOf("data-aut-name-") === 0 && tok.length > 14) {
                if (!attrs["data-aut-name"]) attrs["data-aut-name"] = tok.slice(14);
                found = true;
            }
        });
        if (found) return { dataEl: el, dataAttrs: attrs };
    }
    return { dataEl: target, dataAttrs: {} };
}

function domPath(el) {
    var parts = [];
    for (var depth = 6; el && depth > 0; depth--, el = el.parentElement) {
        var p = (el.tagName || "node").toLowerCase();
        if (el.id) p += "#" + el.id;
        var cls = getClassString(el).trim();
        if (cls) p += "." + cls.replace(/\s+/g, ".");
        parts.push(p);
    }
    return parts.reverse().join(" > ");
}

function parentUrl() {
    try { return window.parent.location.href || null; } catch (e) { return null; }
}

/* ============================================================
   Tracker
   ============================================================ */

var state = { started: null, failed: false, clickListener: false, settings: {} };

function notice(html, setup) {
    var el = document.getElementById("notice");
    el.className = setup ? "setup" : "";
    el.innerHTML = html ? "<div>" + html + "</div>" : "";
}

function esc(s) {
    return String(s).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; });
}

function attachParentClickTracking() {
    if (state.clickListener || !window.parent || window.parent === window) return;
    var parentDoc;
    try { parentDoc = window.parent.document; } catch (e) { return; }  // the report is on another origin
    parentDoc.addEventListener("click", function(e) {
        var s = state.settings;
        if (!s.trackClicks || !window.mixpanel) return;
        var target = e.target;
        var found = getInnermostDataAttrs(target);
        var url = parentUrl();
        window.mixpanel.track("omniscope_component_click", {
            user_identity: s.user,
            aut_name_path: getAutNamePath(target),
            data_attrs: found.dataAttrs,
            dom_path: domPath(found.dataEl),
            tag: found.dataEl.tagName,
            id: found.dataEl.id || null,
            classes: getClassString(found.dataEl) || null,
            click_x: e.clientX,
            click_y: e.clientY,
            parent_url: url,
            report_name: url ? extractReportName(url) : null,
            tab_name: url ? extractTabName(url) : null
        });
    }, true);
    state.clickListener = true;
}

function update() {
    var ctx = omniscope.view.context();
    var opts = ctx.options.items || {};
    var vars = ctx.variables || {};
    var token = String(opts.token || "").trim();
    var host = String(opts.api_host || "https://api-eu.mixpanel.com").trim().replace(/\/+$/, "");
    state.settings = {
        trackClicks: opts.trackClicks !== false,
        user: opts.sendUser === false ? null : (vars["!userIdentity"] || null)
    };

    if (!token) {
        return notice("<div class='title'>Mixpanel tracker</div>Set the Mixpanel project token in the view's settings. " +
            "Nothing is loaded or sent until it is set.", true);
    }
    if (!/^https:\/\/[A-Za-z0-9.\-]+(:\d+)?(\/[^\s]*)?$/.test(host)) {
        return notice("<div class='title'>Mixpanel tracker</div>API host must be an https:// address, " +
            "for example https://api-eu.mixpanel.com. Nothing is sent.", true);
    }
    if (state.failed) {
        return notice("<div class='title'>Mixpanel tracker</div>Mixpanel's library could not be loaded " +
            "(a firewall or content blocker may be blocking cdn.jsdelivr.net). Nothing is sent.", true);
    }
    var key = token + " " + host;
    if (state.started && state.started !== key) {
        return notice("<div class='title'>Mixpanel tracker</div>Reload the report to send to the new project or host.", true);
    }

    if (!state.started) {
        state.started = key;
        installMixpanel(MIXPANEL_LIB, function() { state.failed = true; update(); });
        window.mixpanel.init(token, {
            api_host: host,
            autocapture: false,
            track_pageview: false,
            record_sessions_percent: 0
        });
        var url = parentUrl();
        window.mixpanel.track("omniscope_custom_view_loaded", {
            user_identity: state.settings.user,
            api_host: host,
            parent_url: url,
            report_name: url ? extractReportName(url) : null,
            tab_name: url ? extractTabName(url) : null
        });
    }
    attachParentClickTracking();

    if (opts.showNotice === false) return notice("", false);
    notice(esc(state.settings.trackClicks
        ? "Use of this report, including clicks, is recorded with Mixpanel."
        : "Opening this report is recorded with Mixpanel."), false);
}

omniscope.view.on("load", function() {
    window.onerror = function(msg) {
        omniscope.view.error(msg);
    };
});
omniscope.view.on(["load", "update"], update);

// A click on the view clears the selection in the report, as a click on empty space in any view does.
document.body.addEventListener("click", function() {
    omniscope.view.whitespaceClick();
});
</script>

</body>
</html>
