            else { h += '<table><tr><th>' + esc(M.F.g) + '</th><th>Values</th><th>MAD</th><th></th></tr>'; M.groups.slice(0, 12).forEach(function (G) { h += '<tr class="g gr' + (S.focus === G.name ? ' sel' : '') + '" data-g="' + esc(G.name) + '"><td title="' + esc(G.name) + '">' + esc(G.name) + '</td><td>' + G.N.toLocaleString() + '</td><td>' + G.mad.toFixed(4) + '</td><td><span class="tag c' + G.cls + '">' + ["Close", "Acceptable", "Marginal", "Nonconforming"][G.cls] + '</span></td></tr>'; }); h += '</table><div class="note">' + M.groups.length + ' of ' + M.ngroups.toLocaleString() + ' have at least ' + M.minG + ' values. Click one to compare it with Benford and select its records.</div>'; }
        }
        h += '<div class="note">A digit pattern that departs from Benford\u2019s law is a prompt to look closer (for example amounts kept under an approval limit, round sums or duplicated payments), not proof of anything wrong. Click a bar to select the records with that ' + (M.mode === "FIRST_TWO" ? "pair of leading digits" : "digit") + '.</div>';
        el.innerHTML = h;
        Array.prototype.forEach.call(el.querySelectorAll("tr.gr"), function (r) { r.addEventListener("click", function (e) { e.stopPropagation(); focusGroup(r.getAttribute("data-g")); }); });
        Array.prototype.forEach.call(el.querySelectorAll("tr.g[data-d]"), function (r) { r.addEventListener("click", function (e) { e.stopPropagation(); selectDigit(+r.getAttribute("data-d")); }); });
    }

    function tipBar(r, A, ev) {
        var M = S.model, more = r.p - r.e;
        show('<b>' + MODES[M.mode].label + ' ' + r.d + '</b><br><span class="k">Values:</span> ' + r.n.toLocaleString() + '<br><span class="k">Actual:</span> ' + pct(r.p, 2) + '<br><span class="k">Expected:</span> ' + pct(r.e, 2) + ' (' + Math.round(r.e * A.N).toLocaleString() + ' values)<br><span class="k">Difference:</span> ' + (more >= 0 ? "+" : "\u2212") + Math.abs(Math.round(more * A.N)).toLocaleString() + ' values, z = ' + r.z.toFixed(2) + (r.flag ? ' <b style="color:#a34a1a">(stands out)</b>' : ''), ev);
    }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    // Values whose leading digits are d: one interval per order of magnitude (mirrored for negatives).
    function digitFilter(d) {
        var M = S.model, F = M.F.v, iv = [], k0 = Math.floor(Math.log10(Math.max(M.minA, 1e-12))), k1 = Math.floor(Math.log10(M.maxA));
        for (var k = k0; k <= k1; k++) {
            var u = Math.pow(10, k), add = function (lo, hi) { lo = Math.max(lo, M.minV); if (hi > lo) iv.push([+lo.toPrecision(12), +hi.toPrecision(12)]); };
            if (M.mode === "FIRST") add(d * u, (d + 1) * u);
            else if (M.mode === "FIRST_TWO") add(d * u / 10, (d + 1) * u / 10);
            else for (var f = 1; f <= 9; f++) add((10 * f + d) * u / 10, (10 * f + d + 1) * u / 10);
        }
        var cl = []; iv.forEach(function (p) {
            cl.push({ type: "AND", filters: [{ type: "FIELD_VALUE", inputField: F, operator: ">=", value: p[0] }, { type: "FIELD_VALUE", inputField: F, operator: "<", value: p[1] }] });
            if (M.hasNeg) cl.push({ type: "AND", filters: [{ type: "FIELD_VALUE", inputField: F, operator: ">", value: -p[1] }, { type: "FIELD_VALUE", inputField: F, operator: "<=", value: -p[0] }] });
        });
        return cl.length === 1 ? cl[0] : { type: "OR", filters: cl };
    }
    function groupFilter(name) { var M = S.model, G = M.groups.find(function (g) { return g.name === name; }); return { type: "FIELD_VALUE", inputField: M.F.g, operator: "=", value: G.raw === undefined ? null : G.raw }; }
    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    function selectDigit(d) {
        if (S.sel && S.sel.digit === d) return S.focus ? publish(groupFilter(S.focus), { group: S.focus }) : publish(null, null);
        var f = digitFilter(d); if (S.focus) f = { type: "AND", filters: [groupFilter(S.focus), f] };
        publish(f, { digit: d, group: S.focus || undefined });
    }
    function focusGroup(name) { if (S.focus === name) { S.focus = null; return publish(null, null); } S.focus = name; publish(groupFilter(name), { group: name }); }
    window.__ben.selectDigit = selectDigit; window.__ben.focusGroup = focusGroup; window.__ben.digitFilter = digitFilter;

    document.getElementById("chart").addEventListener("click", function () { S.focus = null; if (S.sel) publish(null, null); else draw(); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
</body>
