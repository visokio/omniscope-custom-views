            .on("mousemove", function (ev) { var p = nearest(ev); cross.attr("x1", m.l + x(p.t)).attr("x2", m.l + x(p.t)).attr("opacity", 0.35); tipAt(p, ev); })
            .on("mouseleave", function () { cross.attr("opacity", 0); tip(); })
            .on("click", function (ev) { ev.stopPropagation(); selectPeriod(nearest(ev)); });
        var lg = svg.append("g").attr("transform", "translate(" + (m.l + 190) + "," + (m.t - 10) + ")").style("font-size", "10.5px").attr("fill", "#52514e"), lx = 0;
        [[INK, "Actual"], [TREND, "Trend"], [ANOM, "Unusual (" + M.anoms.length + ")"]].forEach(function (L) { var e = lg.append("g").attr("transform", "translate(" + lx + ",0)"); if (L[0] === ANOM) e.append("circle").attr("cx", 5).attr("cy", -3).attr("r", 4).attr("fill", "none").attr("stroke", ANOM).attr("stroke-width", 1.6); else e.append("line").attr("x1", 0).attr("x2", 12).attr("y1", -3).attr("y2", -3).attr("stroke", L[0]).attr("stroke-width", 2); var t = e.append("text").attr("x", 16).text(L[1]); lx += 16 + t.node().getComputedTextLength() + 14; });
        if (intro) { linesIn(svg, 1300); fadeIn(svg.selectAll("g rect:not(.plot)"), 700, 0); }
        side();
    }

    function tipAt(p, ev) {
        var M = S.model, h = '<b>' + esc(M.label(new Date(p.t))) + '</b><br><span class="k">Actual:</span> ' + fmt(p.v) + (p.missing ? ' <span class="k">(no data)</span>' : '') + '<br><span class="k">Trend:</span> ' + fmt(p.trend) + (p.ext ? ' <span class="k">(extended)</span>' : '') + '<br><span class="k">Seasonal:</span> ' + (M.mult ? '\u00d7' + p.sea.toFixed(3) : (p.sea >= 0 ? "+" : "") + fmt(p.sea));
        if (p.res !== null) h += '<br><span class="k">Expected:</span> ' + fmt(p.expected) + '<br><span class="k">Residual:</span> ' + (M.mult ? spct(p.res) : (p.res >= 0 ? "+" : "") + fmt(p.res)) + (p.anom ? ' <b style="color:' + ANOM + '">unusual</b>' : '');
        show(h, ev);
    }
    function side() {
        var M = S.model, el = document.getElementById("side"), hi = d3.max(M.idx), lo = d3.min(M.idx), P = M.series;
        var peak = M.idx.indexOf(hi), trough = M.idx.indexOf(lo), first = P[0].t, posLabel = function (i) { var t = P[i] ? P[i].t : addUnit(first, M.unit, i); var d = new Date(t); return M.unit === "MONTH" ? d3.utcFormat("%B")(d) : M.unit === "DAY" ? d3.utcFormat("%A")(d) : M.unit === "QUARTER" ? "Q" + (Math.floor(d.getUTCMonth() / 3) + 1) : "around " + d3.utcFormat("%d %B")(d); };
        var h = '<h3>Components</h3><div class="stat">Trend over the last ' + M.m + ' ' + UNITN[M.unit] + ': <b class="' + (M.trendChange >= 0 ? "up" : "down") + '">' + spct(M.trendChange) + '</b></div>';
        h += '<div class="stat">Seasonal peak ' + esc(posLabel(peak)) + ' (' + (M.mult ? '\u00d7' + hi.toFixed(2) : '+' + fmt(hi)) + '), low ' + esc(posLabel(trough)) + ' (' + (M.mult ? '\u00d7' + lo.toFixed(2) : fmt(lo)) + ')</div>';
        if (M.strength !== null) h += '<div class="stat">Strength of seasonality: <b>' + (M.strength >= 0.64 ? "strong" : M.strength >= 0.36 ? "moderate" : "weak") + '</b> (' + M.strength.toFixed(2) + ')</div>';
        h += '<h3>Unusual ' + UNITN[M.unit] + '</h3>';
        if (!M.anoms.length) h += '<div class="note" style="margin-top:0">None beyond ' + M.thr + ' robust standard deviations.</div>';
        else { h += '<table><tr><th></th><th>Actual</th><th>Expected</th><th>Diff.</th></tr>'; M.anoms.slice().sort(function (a, b) { return Math.abs(b.z) - Math.abs(a.z); }).slice(0, 12).forEach(function (p) { var d = p.expected ? p.v / p.expected - 1 : null; h += '<tr class="an' + (S.sel && S.sel.t === p.t ? ' sel' : '') + '" data-t="' + p.t + '"><td>' + esc(M.label(new Date(p.t)).replace("w/c ", "")) + '</td><td>' + fmt(p.v) + '</td><td>' + fmt(p.expected) + '</td><td class="' + (d >= 0 ? "up" : "down") + '">' + spct(d) + '</td></tr>'; }); h += '</table>'; }
        h += '<div class="note">' + (M.mult ? 'Multiplicative' : 'Additive') + ' classical decomposition with a season of ' + M.m + ' ' + UNITN[M.unit] + '. The trend is a centred moving average, extended (dashed) over the first and last half-season. Two passes are made: unusual periods found in the first are left out of the seasonal pattern and bridged in the trend, so an outage or a campaign does not distort either. Where the trend is extended a period must stand out 2.5 times as much to be flagged. A ' + UNITN[M.unit].replace(/s$/, "") + ' is unusual when its residual is more than ' + M.thr + ' robust standard deviations from typical. Click any ' + UNITN[M.unit].replace(/s$/, "") + ' to select it.</div>';
        el.innerHTML = h;
        Array.prototype.forEach.call(el.querySelectorAll("tr.an"), function (r) { r.addEventListener("click", function (e) { e.stopPropagation(); var t = +r.getAttribute("data-t"); selectPeriod(M.series.find(function (p) { return p.t === t; })); }); });
    }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    function selectPeriod(p) {
        if (!p) return; if (S.sel && S.sel.t === p.t) return publish(null, null);
        var M = S.model, F = M.F.d, iso = function (t) { return new Date(t).toISOString().slice(0, 10); };
        publish({ type: "AND", filters: [{ type: "FIELD_VALUE", inputField: F, operator: ">=", value: iso(p.t) }, { type: "FIELD_VALUE", inputField: F, operator: "<", value: iso(addUnit(p.t, M.unit, 1)) }] }, { t: p.t });
    }
    window.__dec.selectAnomaly = function (k) { selectPeriod(S.model.anoms[k]); };

    document.getElementById("chart").addEventListener("click", function () { if (S.sel) publish(null, null); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
</body>
