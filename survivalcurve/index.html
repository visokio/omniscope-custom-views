        if (G.length > 1) { var lx0 = 0, lg = svg.append("g").attr("transform", "translate(" + m.l + ",14)"); G.forEach(function (Gi) { var e = lg.append("g").attr("class", "lg").attr("transform", "translate(" + lx0 + ",0)").attr("opacity", dim(Gi)).on("click", function (ev) { ev.stopPropagation(); selectGroup(Gi); }); e.append("rect").attr("y", -4).attr("width", 14).attr("height", 3).attr("rx", 1.5).attr("fill", Gi.colour); var t = e.append("text").attr("x", 19).attr("dy", "0.1em").style("font-size", "11px").attr("fill", "#2b2a28").text(Gi.name); lx0 += 19 + t.node().getComputedTextLength() + 16; }); }
        // numbers at risk
        if (tableH) {
            var tg = svg.append("g").attr("transform", "translate(" + m.l + "," + (m.t + h + 44) + ")").style("font-size", "10.5px");
            tg.append("text").attr("x", -m.l + 6).attr("y", 0).attr("fill", "#52514e").style("font-weight", "bold").text("Number at risk");
            (G.length > 1 ? G : [G[0]]).forEach(function (Gi, r) {
                var yy = 16 + r * 16; tg.append("rect").attr("x", -m.l + 6).attr("y", yy - 7).attr("width", 10).attr("height", 3).attr("fill", Gi.colour);
                xt.forEach(function (t) { tg.append("text").attr("x", x(t)).attr("y", yy).attr("text-anchor", "middle").attr("fill", "#52514e").text(atRisk(Gi, t).toLocaleString()); });
            });
        }
        // hover crosshair
        var cross = g.append("line").attr("y1", 0).attr("y2", h).attr("stroke", "#52514e").attr("stroke-width", 1).attr("opacity", 0).attr("pointer-events", "none");
        var move = function (ev) { var t = Math.max(0, x.invert(d3.pointer(ev, g.node())[0])); cross.attr("x1", x(t)).attr("x2", x(t)).attr("opacity", 0.5); tipAt(t, ev, f, cum); }, leave = function () { cross.attr("opacity", 0); tip(); };
        g.insert("rect", ":first-child").attr("class", "plot").attr("width", w).attr("height", h).attr("fill", "transparent").on("mousemove", move).on("mouseleave", leave);
        g.selectAll(".hit").raise().on("mousemove", move).on("mouseleave", leave);
        if (intro) { linesIn(svg, 1200); }
        side(cum);
    }

    function tipAt(t, ev, f, cum) {
        var M = S.model, u = M.unit1 === M.unit ? M.unit : t === 1 ? M.unit1 : M.unit;
        var h = '<b>At ' + (+t.toPrecision(3)) + ' ' + esc(u) + '</b>';
        M.groups.forEach(function (Gi) { if (t > Gi.tmax) return; var p = at(Gi, t); h += '<br><span class="sw" style="background:' + Gi.colour + '"></span>' + esc(Gi.name) + ': <b>' + pct(f(p.s)) + '</b> <span class="k">' + (cum ? "ended" : "still active") + ' (95% CI ' + pct(cum ? 1 - p.hi : p.lo) + ' to ' + pct(cum ? 1 - p.lo : p.hi) + '), ' + atRisk(Gi, t).toLocaleString() + ' at risk</span>'; });
        show(h, ev);
    }
    function side(cum) {
        var M = S.model, el = document.getElementById("side"), span = M.tmax, marks = d3.ticks(0, span, 4).filter(function (v) { return v > 0 && v < span; }).slice(0, 3);
        var h = '<h3>Survival summary</h3><div class="note" style="margin-top:0">' + M.n.toLocaleString() + ' records' + (M.bad ? ', ' + M.bad.toLocaleString() + ' skipped (missing or negative time)' : '') + (M.dateMode ? '. Open records are counted to ' + new Date(M.asof).toISOString().slice(0, 10) + ', the latest date in the data.' : '.') + '</div>';
        h += '<table><tr><th>' + (M.F.g ? esc(M.F.g) : "") + '</th><th>Records</th><th>Ended</th><th title="Time by which half have ended">Median</th></tr>';
        M.groups.forEach(function (Gi) { h += '<tr class="g' + (S.sel && S.sel.group === Gi.name ? ' sel' : '') + '" data-g="' + esc(Gi.name) + '"><td><span class="sw" style="background:' + Gi.colour + '"></span>' + esc(Gi.name) + '</td><td>' + Gi.n.toLocaleString() + '</td><td>' + Gi.events.toLocaleString() + '</td><td>' + (Gi.median === null ? '<span title="More than half are still active">not reached</span>' : (+Gi.median.toPrecision(3))) + '</td></tr>'; });
        h += '</table><div class="note" style="margin-top:3px">Median in ' + esc(M.unit) + '.</div>';
        if (marks.length) {
            h += '<h3>' + (cum ? "Ended by" : "Still active at") + '</h3><table><tr><th>' + (M.unit === M.F.d ? '' : esc(M.unit.charAt(0).toUpperCase() + M.unit.slice(1))) + '</th>' + marks.map(function (t) { return '<th>' + (+t.toPrecision(3)) + '</th>'; }).join("") + '</tr>';
            M.groups.forEach(function (Gi) { h += '<tr><td><span class="sw" style="background:' + Gi.colour + '"></span>' + esc(Gi.name) + '</td>' + marks.map(function (t) { var s = at(Gi, t).s; return '<td>' + (t > Gi.tmax ? '' : pct(cum ? 1 - s : s)) + '</td>'; }).join("") + '</tr>'; });
            h += '</table>';
        }
        if (M.test) {
            var p = M.test.p, ptxt = p < 0.001 ? "p < 0.001" : "p = " + p.toFixed(3);
            h += '<h3>Are the groups different?</h3><div class="test">Log-rank test: chi-square ' + M.test.chi.toFixed(1) + ' on ' + M.test.df + ' degree' + (M.test.df === 1 ? '' : 's') + ' of freedom, <b>' + ptxt + '</b>.<br>' + (p < 0.05 ? 'The curves differ by more than chance would explain.' : 'The differences could be due to chance.') + '</div>';
        }
        if (M.more) h += '<div class="note">' + M.more.toLocaleString() + ' smaller groups are combined as Other.</div>';
        h += '<div class="note">Dashed lines mark each median (half ended). Ticks mark records still active. Shaded bands are 95% confidence intervals. Click a curve or a row to select its records.</div>';
        el.innerHTML = h;
        Array.prototype.forEach.call(el.querySelectorAll("tr.g"), function (r) { r.addEventListener("click", function (e) { e.stopPropagation(); var n = r.getAttribute("data-g"); selectGroup(M.groups.find(function (Gi) { return Gi.name === n; })); }); });
    }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    function selectGroup(Gi) {
        var M = S.model; if (!M.F.g || !Gi || Gi.other) return;
        if (S.sel && S.sel.group === Gi.name) return publish(null, null);
        publish({ type: "FIELD_VALUE", inputField: M.F.g, operator: "=", value: Gi.name === "(blank)" ? null : Gi.name }, { group: Gi.name });
    }
    window.__surv.selectGroup = function (n) { selectGroup(S.model.groups.find(function (Gi) { return Gi.name === n; })); };
    window.__surv.at = function (n, t) { var Gi = S.model.groups.find(function (x) { return x.name === n; }); return at(Gi, t).s; };

    document.getElementById("chart").addEventListener("click", function () { if (S.sel) publish(null, null); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
</body>
