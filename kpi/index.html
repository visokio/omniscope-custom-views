<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>

    <style>
        html, body, main {
          /* Ensure the body fills the view, so clicks are handled everywhere: */
          width: 100%;
          height: 100%;
          margin: 0px;
        }
        main {
          font-family: monospace;
          font-size: 17px;
          display: table;
          position: absolute;
          height: 100%;
          width: 100%;
        }
        span {
          font-size: 15px;
          color: #000;
        }
        #container {
          width: 100%;
          height: 100%;
          text-align: center;
          color: #41475e;
          font-family: 'Montserrat', Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;
          display: table-cell;
          vertical-align: middle;
        }
        #content-container {
          margin-left: auto;
          margin-right: auto;
          padding: 10px;
        }
        #measure {
          font-size: 2em;
          font-weight: bold;
          color: #f39300;
          white-space: nowrap;
        }
        #text {
          font-size: 0.9em;
          font-weight: bold;
        }
        #measure.none {
          color: #8a8f9c;
          font-weight: normal;
        }
    </style>

    <!-- Put SCRIPT tags to load 3rd party libraries here -->

</head>

<body>

  <main id="main">
    <div id="container">
      <div id="content-container">
        <div>
          <span id="text"></span>
          <br/>
          <span id="measure"></span>
        </div>
      </div>
    </div>
  </main><!-- This element is where the view will render -->

<script src="/_global_/customview/v1/omniscope.js"></script><!-- Add the Omniscope custom view API -->

<script>
    if (!omniscope || !omniscope.view) throw new Error("Omniscope chart API is not loaded");
    omniscope.view.on("load", function() {
        window.onerror = function(msg) {
            omniscope.view.error(msg);
        }
    });

    // Ensure clicks on unoccupied space clear the selection in Omniscope, and close menus:
    document.body.addEventListener("click", function() {
        omniscope.view.whitespaceClick();
    });

    // Number shown: whole numbers from 100 up, two decimals from 1, three significant digits below 1.
    function format(v) {
        var a = Math.abs(v);
        if (a >= 100) return Math.round(v).toLocaleString();
        if (a >= 1) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
        return v.toLocaleString(undefined, { maximumSignificantDigits: 3 });
    }

    // Title when the Title text option is empty: what the measure is, e.g. "Sales (sum)" or "Record count".
    function measureLabel(m) {
        if (!m) return "";
        if (m.displayName) return m.displayName;
        if (!m.function || m.function === "RECORD_COUNT") return "Record count";
        return m.inputField + " (" + m.function.toLowerCase().replace(/_/g, " ") + ")";
    }

    // Value size follows the pane: as large as fits, between 14 and 96 pixels.
    function fit() {
        var el = document.getElementById("measure"), text = el.textContent || "0";
        var w = window.innerWidth - 24, h = window.innerHeight;
        var size = Math.max(14, Math.min(96, h * 0.4, w / (0.62 * Math.max(3, text.length))));
        el.style.fontSize = Math.round(size) + "px";
        document.getElementById("text").style.fontSize = Math.round(Math.max(11, Math.min(20, size * 0.38))) + "px";
    }

    // Redraw on any of these events
    // (load = first init, update = external settings/state change, resize = browser window resized)
    omniscope.view.on(["load", "update", "resize"], function() {
        var ctx = omniscope.view.context(), items = ctx.options.items || {};
        var result = ctx.result, mappings = (result && result.mappings) || {};
        var records = (result && result.data && result.data.records) || [];
        var col = mappings.measure;
        var title = (items.text !== undefined && items.text !== null && items.text !== "") ? items.text : measureLabel(items.measure);
        document.getElementById("text").textContent = title;
        var value = (col !== undefined && records.length) ? records[0][col] : null;
        var el = document.getElementById("measure");
        el.classList.remove("none");
        if (!items.measure || col === undefined) { el.textContent = "Choose a measure"; el.classList.add("none"); }
        else if (typeof value !== "number" || !isFinite(value)) { el.textContent = "No data"; el.classList.add("none"); }
        else el.textContent = format(value);
        fit();
    });

</script>

</body>
</html>
