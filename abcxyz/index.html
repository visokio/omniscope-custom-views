<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

        #main { position: absolute; inset: 0; display: flex; }
        #chart { flex: 1; position: relative; min-width: 0; }

        svg { display: block; position: absolute; left: 0; top: 0; }
        .cell { cursor: pointer; } .cell:hover rect.bg { stroke: #0b0b0b; stroke-width: 1.5; }
        h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #52514e; margin: 12px 0 6px; } h3:first-child { margin-top: 0; }

        .cls { margin-bottom: 7px; line-height: 1.4; } .cls b { display: inline-block; min-width: 26px; } .cls .p { color: #52514e; font-size: 11px; }

        #tooltip { position: absolute; display: none; pointer-events: none; background: rgba(252,252,251,.97); border: 1px solid rgba(11,11,11,.1); box-shadow: 0 4px 14px rgba(0,0,0,.15); border-radius: 6px; padding: 6px 9px; line-height: 1.45; white-space: nowrap; z-index: 5; }
        #tooltip .k { color: #52514e; }
        #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #52514e; font-size: 14px; padding: 20px; background: #fcfcfb; z-index: 6; }
    </style>

    <!-- Put SCRIPT tags to load 3rd party libraries here -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>

<body>
<div id="main"><!-- This element is where the view will render -->
    <div id="chart"><svg id="svg"></svg></div>
    <div id="side"></div>
</div>
<div id="tooltip"></div>
<div id="message"></div>

<script src="/_global_/customview/v1/omniscope.js"></script><!-- Add the Omniscope custom view API -->

<script>
(function () {
    if (!omniscope || !omniscope.view) throw new Error("Omniscope chart API is not loaded");

    var CELL = { AX: "#184f95", AY: "#2a6fc4", AZ: "#3987e5", BX: "#3987e5", BY: "#6fa8ec", BZ: "#9ec5f4", CX: "#9ec5f4", CY: "#c9def8", CZ: "#e8f1fc" }, SELECT = "#2161D9";
    var ADVICE = {

        AZ: "High value, erratic demand: avoid holding much stock; order to demand where possible and review individually.",

        BZ: "Medium value, erratic demand: consider ordering to demand; watch for obsolete stock.",

    function num(v, d, lo, hi) { v = v === null || v === undefined || v === "" || isNaN(+v) ? d : +v; return Math.max(lo, Math.min(hi, v)); }

    function load() {

        var o = it(), F = { i: fld(o.item), d: fld(o.date), q: fld(o.demand), v: fld(o.value) };
        if (!F.i || !F.d || !F.q) { message("Choose the Items field (SKU or product), the date (Dated by) and the Demand (units sold or used). Add a Value field to rank by revenue."); return; }
        var unit = o.period === "WEEK" ? "WEEK" : o.period === "QUARTER" ? "QUARTER" : "MONTH";

        list.sort(function (a, b) { return b.val - a.val || (a.name < b.name ? -1 : 1); });
        var total = d3.sum(list, function (I) { return I.val; }), acc = 0;
        list.forEach(function (I, r) { var before = total ? acc / total : 0; acc += I.val; I.cum = total ? acc / total : 0; I.rank = r; I.a = before < aCut ? "A" : before < bCut ? "B" : "C"; I.cls = I.a + I.x; });
        var cells = {}; "ABC".split("").forEach(function (a) { "XYZ".split("").forEach(function (x) { cells[a + x] = { k: a + x, a: a, x: x, n: 0, val: 0, units: 0, items: [] }; }); });

        var box = document.getElementById("chart"), W = box.clientWidth, H = box.clientHeight; svg.attr("width", W).attr("height", H); svg.selectAll("*").remove();
        var wide = W > 620, gw = wide ? W * 0.56 : W - 20, top = 50, L = 64, size = Math.max(40, Math.min((gw - L - 10) / 3, (H - top - 50) / 3));
        var g = svg.append("g").attr("transform", "translate(" + L + "," + top + ")"), sel = S.sel;
        var xl = { X: "X: steady", Y: "Y: variable", Z: "Z: erratic" }, al = { A: "A", B: "B", C: "C" };
        "ABC".split("").forEach(function (a, ri) {
            "XYZ".split("").forEach(function (x, ci) {
                var c = M.cells[a + x], isSel = sel && sel.cls === c.k, dim = sel && sel.cls && !isSel, fill = CELL[c.k], ink = d3.lab(fill).l > 62 ? "#0b0b0b" : "#ffffff";
                var e = g.append("g").attr("class", "cell").attr("transform", "translate(" + ci * size + "," + ri * size + ")").attr("opacity", dim ? 0.35 : 1)
                    .on("mousemove", function (ev) { tipCell(c, ev); }).on("mouseleave", tip).on("click", function (ev) { ev.stopPropagation(); selectClass(c); });
                e.append("rect").attr("class", "bg").attr("x", 1.5).attr("y", 1.5).attr("width", size - 3).attr("height", size - 3).attr("rx", 4).attr("fill", fill).attr("stroke", isSel ? SELECT : "none").attr("stroke-width", 3);
                e.append("text").attr("x", 10).attr("y", 22).style("font-weight", "bold").style("font-size", size > 110 ? "16px" : "13px").attr("fill", ink).text(c.k);
                if (size > 70) {
                    e.append("text").attr("x", size / 2).attr("y", size / 2).attr("text-anchor", "middle").style("font-size", size > 110 ? "20px" : "15px").style("font-weight", "bold").attr("fill", ink).text(c.n.toLocaleString());
                    e.append("text").attr("x", size / 2).attr("y", size / 2 + 18).attr("text-anchor", "middle").style("font-size", "11px").attr("fill", ink).text("items, " + pct(M.total ? c.val / M.total : 0) + " of value");
                } else e.append("text").attr("x", size / 2).attr("y", size / 2 + 8).attr("text-anchor", "middle").style("font-size", "11px").attr("fill", ink).text(c.n.toLocaleString());
            });
        });
        var ax = svg.append("g").style("font-size", "11px").attr("fill", "#52514e");
        "XYZ".split("").forEach(function (x, ci) { ax.append("text").attr("x", L + ci * size + size / 2).attr("y", top - 8).attr("text-anchor", "middle").text(xl[x]); });
        "ABC".split("").forEach(function (a, ri) { var share = d3.sum("XYZ".split(""), function (x) { return M.cells[a + x].val; }) / (M.total || 1); ax.append("text").attr("x", L - 8).attr("y", top + ri * size + size / 2 - 6).attr("text-anchor", "end").style("font-weight", "bold").attr("fill", "#2b2a28").text(al[a]); ax.append("text").attr("x", L - 8).attr("y", top + ri * size + size / 2 + 9).attr("text-anchor", "end").text(pct(share)); });
        var nA = M.list.filter(function (I) { return I.a === "A"; }).length;
        var head = svg.append("text").attr("x", 10).attr("y", 18).style("font-size", "12.5px");
        head.append("tspan").style("font-weight", "bold").text(M.list.length.toLocaleString() + " items: " + pct(nA / M.list.length) + " of them make up " + pct(d3.sum(M.list.filter(function (I) { return I.a === "A"; }), function (I) { return I.val; }) / (M.total || 1)) + " of " + (M.F.v ? M.F.v : M.F.q));
        head.append("tspan").attr("fill", "#52514e").text("  (" + M.np + " " + M.unit.toLowerCase() + "s of demand)");
        // Pareto curve
        if (wide) {
            var px = L + 3 * size + 40, pw = W - px - 16, ph = 3 * size, pg = svg.append("g").attr("transform", "translate(" + px + "," + top + ")");

            pg.append("g").attr("transform", "translate(0," + ph + ")").call(d3.axisBottom(xs).ticks(4).tickFormat(d3.format(".0%"))).selectAll("text").attr("fill", "#52514e");
            pg.append("g").call(d3.axisLeft(ys).ticks(4).tickFormat(d3.format(".0%"))).selectAll("text").attr("fill", "#52514e");

    function side() {
