        el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px";
    }

    function keyFilter(field, raw) { return raw && typeof raw === "object" && "lower" in raw ? { type: "AND", filters: [{ type: "FIELD_VALUE", inputField: field, operator: ">=", value: raw.lower }, { type: "FIELD_VALUE", inputField: field, operator: "<", value: raw.upper }] } : { type: "FIELD_VALUE", inputField: field, operator: "=", value: raw }; }
    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); placeSel(); }
    function selectCell(i, j) {
        var M = S.model; if (S.sel && S.sel.i === i && S.sel.j === j) return publish(null, null);
        if (M.grid[i * M.ny + j] === null) return;
        publish({ type: "AND", filters: [keyFilter(M.F.x, M.X.list[i].raw), keyFilter(M.F.y, M.Y.list[j].raw)] }, { i: i, j: j });
    }
    // test hook: screen position of a grid point, for real-mouse clicks
    window.__surf.screenOf = function (i, j) { var M = S.model, v = M.grid[i * M.ny + j], p = new THREE.Vector3(M.X.list[i].pos, M.hY(v), M.Y.list[j].pos).project(S.scene3.camera); return [(p.x + 1) / 2 * window.innerWidth, (1 - p.y) / 2 * window.innerHeight]; };
    window.__surf.selectCell = selectCell;

    omniscope.view.on(["load", "update"], render);
    omniscope.view.on("resize", function () { if (!S.scene3) return; var c = S.scene3; c.renderer.setSize(window.innerWidth, window.innerHeight); c.camera.aspect = window.innerWidth / Math.max(1, window.innerHeight); c.camera.updateProjectionMatrix(); });
})();
