<!doctype html>
<html>
<head>

    <style>

        .panel .sub { position: absolute; left: 12px; top: 22px; color: #898781; font-size: 10.5px; }
        .panel svg { position: absolute; left: 0; top: 0; }

        #cm .rh { display: flex; align-items: center; justify-content: flex-end; color: #52514e; font-size: 11px; text-align: right; padding-right: 6px; }
        #cm .cell { border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; padding: 4px; }
        #cm .cell:hover { outline: 2px solid #0b0b0b; outline-offset: -2px; }
        #cm .cell.sel { outline: 2px dashed #2161D9; outline-offset: -2px; }
        #cm .cell b { font-size: 20px; font-variant-numeric: tabular-nums; }
        #cm .cell span { font-size: 11px; }
        #cm .foot { grid-column: 2 / 4; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: center; color: #52514e; font-size: 11px; }

    </style>

    <!-- Put SCRIPT tags to load 3rd party libraries here -->

</head>

        <div class="panel" id="pDist"><svg></svg><h4>Score distribution by actual outcome</h4><div class="sub">Drag the threshold line or use the slider</div></div>
        <div class="panel" id="pGain"><svg></svg><h4>Cumulative gains</h4><div class="sub" id="gainSub"></div></div>
    </div>
</div>
<div id="tooltip"></div>
<div id="message"></div>

        var lg = f.svg.append("g").attr("transform", "translate(" + (f.W - f.m.r - 170) + "," + (f.m.t - 2) + ")");
        [[POS, "Actual: " + M.posRaw], [NEG, "Actual: " + (M.negRaw.length === 1 ? M.negRaw[0] : "other")]].forEach(function (e, i) { lg.append("rect").attr("x", i * 90).attr("y", -8).attr("width", 10).attr("height", 10).attr("rx", 2).attr("fill", e[0]).attr("opacity", 0.7); lg.append("text").attr("x", i * 90 + 14).attr("y", 1).attr("font-size", 10.5).attr("fill", "#52514e").text(String(e[1]).slice(0, 12)); });
        var tx = x(c.t), line = f.svg.append("g").style("cursor", "ew-resize");
        line.append("line").attr("x1", tx).attr("x2", tx).attr("y1", f.m.t - 4).attr("y2", f.H - f.m.b).attr("stroke", "#0b0b0b").attr("stroke-width", 2);
        line.append("rect").attr("x", tx - 8).attr("y", f.m.t - 4).attr("width", 16).attr("height", f.H - f.m.b - f.m.t + 4).attr("fill", "transparent");
        line.call(d3.drag().on("drag", function (ev) { S.thr = Math.max(M.lo, Math.min(M.lo + M.nb * M.step, x.invert(ev.x))); document.getElementById("thr").value = String(S.thr); draw(); }));
    }
    function drawCm(c) {
        var M = S.model, el = document.getElementById("cm"), tot = M.P + M.N;
        var cell = function (key, n, good, label) {
            var share = tot ? n / tot : 0, col = d3.interpolateRgb((good ? GOOD : BAD)[0], (good ? GOOD : BAD)[1])(Math.min(1, Math.sqrt(share) * 1.4)), dark = d3.lab(col).l < 60;
            return '<div class="cell' + (S.sel === key ? " sel" : "") + '" data-k="' + key + '" style="background:' + col + ';color:' + (dark ? "#fff" : "#0b0b0b") + '"><b>' + Math.round(n).toLocaleString() + '</b><span>' + label + ' &middot; ' + pct(share) + '</span></div>';
        };
        var pl = esc(M.posRaw), nl = esc(M.negRaw.length === 1 ? M.negRaw[0] : "other");
        el.innerHTML = '<div></div><div class="h">Predicted ' + pl + '</div><div class="h">Predicted ' + nl + '</div>' +
            '<div class="rh">Actual ' + pl + '</div>' + cell("TP", c.TP, true, "true positives") + cell("FN", c.FN, false, "false negatives") +
            '<div class="rh">Actual ' + nl + '</div>' + cell("FP", c.FP, false, "false positives") + cell("TN", c.TN, true, "true negatives") +
            '<div class="foot"><span>Specificity ' + pct(c.TN / (c.TN + c.FP)) + '</span><span>Positive rate ' + pct(M.P / tot) + '</span><span>Flagged ' + pct((c.TP + c.FP) / tot) + '</span></div>';
        Array.prototype.forEach.call(el.querySelectorAll(".cell"), function (d) { d.addEventListener("click", function (e) { e.stopPropagation(); selectCell(d.getAttribute("data-k")); }); });
    }
    function selectCell(k) {
        var M = S.model, F = M.fields, t = counts().t;
        var actual = k === "TP" || k === "FN" ? { type: "FIELD_VALUE", inputField: F.actual, operator: "=", value: M.posRaw } : { type: "FIELD_VALUE", inputField: F.actual, operator: "!=", value: M.posRaw };
        var pred = k === "TP" || k === "FP" ? { type: "FIELD_VALUE", inputField: F.score, operator: ">=", value: +t.toPrecision(8) } : { type: "FIELD_VALUE", inputField: F.score, operator: "<", value: +t.toPrecision(8) };
        S.sel = k;
        omniscope.view.context().viewSelection = { filter: { type: "AND", filters: [actual, pred] }, meta: { cell: k } };
        omniscope.view.updated(); draw();
    }
    window.__model.selectCell = selectCell;
    window.__model.setThreshold = function (t) { S.thr = t; draw(); };
    window.__model.counts = counts;
    document.getElementById("thr").addEventListener("input", function () { S.thr = +this.value; draw(); });
    document.getElementById("top").addEventListener("click", function (e) { e.stopPropagation(); });
    document.body.addEventListener("click", function () { if (S.sel) { S.sel = null; draw(); } omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
