<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { font-family: Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 12px; color: #0b0b0b; background: #fcfcfb; }
        #main { position: absolute; inset: 0; display: flex; flex-direction: column; }
        #summary { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 12px 2px; }
        .badge { display: flex; align-items: center; gap: 7px; }
        .badge .ico { width: 30px; height: 30px; flex: none; }
        .badge b { display: block; font-size: 12px; }
        .badge span { color: #52514e; font-size: 11px; }
        .kpi { color: #52514e; }
        .kpi b { color: #0b0b0b; font-size: 15px; margin-right: 3px; font-variant-numeric: tabular-nums; }
        #legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 2px 12px 0; color: #52514e; font-size: 11px; }
        #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
        #legend .ln { display: inline-block; width: 16px; height: 0; border-top: 2px dashed #898781; margin-right: 4px; vertical-align: 3px; }
        #chart { flex: 1; position: relative; min-height: 80px; }
        svg { display: block; }
        .axis text { fill: #898781; font-size: 10px; }
        .axis path, .axis line { stroke: #c3c2b7; }
        .grid line { stroke: #e1e0d9; }
        .grid path { display: none; }
        #tooltip { position: absolute; display: none; pointer-events: none; background: rgba(252,252,251,0.97); border: 1px solid rgba(11,11,11,.1); box-shadow: 0 4px 14px rgba(0,0,0,.15); border-radius: 6px; padding: 7px 10px; line-height: 1.45; white-space: nowrap; z-index: 4; }
        #tooltip .k { color: #52514e; }
        #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #52514e; font-size: 14px; padding: 20px; background: #fcfcfb; z-index: 6; }
        body.compact #summary .badge span, body.compact #legend { display: none; }
    </style>

    <!-- Put SCRIPT tags to load 3rd party libraries here -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>

</div>
<div id="message"></div>

        }
        // data line and points (points >= 8px across, 2px surface ring)
        g.append("path").datum(pts).attr("fill", "none").attr("stroke", C.line).attr("stroke-width", 1.6).attr("d", d3.line().x(function (p) { return x(p.i); }).y(function (p) { return y(p.v); }));
        var r = pts.length > 200 ? 2.5 : pts.length > 80 ? 3.5 : 4.5;
        g.selectAll("circle.pt").data(pts).enter().append("circle").attr("class", "pt").attr("cx", function (p) { return x(p.i); }).attr("cy", function (p) { return y(p.v); })
            .attr("r", function (p) { return p.cause === "common" ? r * 0.8 : r; }).attr("fill", function (p) { return C[p.cause]; }).attr("stroke", "#fcfcfb").attr("stroke-width", 1.5);
        g.selectAll("circle.sel").data(pts.filter(function (p) { return S.selected.has(p.key); })).enter().append("circle").attr("class", "sel").attr("cx", function (p) { return x(p.i); }).attr("cy", function (p) { return y(p.v); })
            .attr("r", r + 3.5).attr("fill", "none").attr("stroke", C.select).attr("stroke-width", 1.5).attr("stroke-dasharray", "3,2");
        // moving range chart
        if (showMR) {
            var top = m.t + hX + gap, yr = d3.scaleLinear().domain([0, d3.max(pts.map(function (p) { return p.mr || 0; }).concat(phases.map(function (p) { return p.mrUcl; }))) * 1.1 || 1]).nice().range([top + hR, top]);
            g.append("text").attr("x", m.l).attr("y", top - 6).attr("fill", "#52514e").attr("font-size", 10).text("Moving range");
            g.append("g").attr("class", "axis").attr("transform", "translate(" + m.l + ",0)").call(d3.axisLeft(yr).ticks(3).tickFormat(tf(yr.domain())));
            g.append("g").attr("class", "axis").attr("transform", "translate(0," + (top + hR) + ")").call(xAxis());
            phases.forEach(function (ph) {
                var x0 = x(ph.from - 0.5), x1 = x(ph.to + 0.5);
                g.append("line").attr("x1", x0).attr("x2", x1).attr("y1", yr(ph.mrBar)).attr("y2", yr(ph.mrBar)).attr("stroke", C.mean).attr("stroke-width", 1);
                g.append("line").attr("x1", x0).attr("x2", x1).attr("y1", yr(ph.mrUcl)).attr("y2", yr(ph.mrUcl)).attr("stroke", C.limit).attr("stroke-dasharray", "6,4");
            });
            var mrPts = pts.filter(function (p) { return p.mr !== null; });
            g.append("path").datum(mrPts).attr("fill", "none").attr("stroke", "#9a988f").attr("stroke-width", 1.2).attr("d", d3.line().x(function (p) { return x(p.i); }).y(function (p) { return yr(p.mr); }));
            g.selectAll("circle.mr").data(mrPts.filter(function (p) { return p.mr > phases[p.phase].mrUcl; })).enter().append("circle").attr("cx", function (p) { return x(p.i); }).attr("cy", function (p) { return yr(p.mr); }).attr("r", 3).attr("fill", C.neutral);
        }
        // interaction layer: hover crosshair, click to select, drag to select a range
        var cross = g.append("line").attr("y1", m.t).attr("y2", H - m.b).attr("stroke", "#c3c2b7").style("display", "none");
        var brush = g.append("rect").attr("y", m.t).attr("height", hX).attr("fill", C.select).attr("opacity", 0.12).style("display", "none");
        var overlay = g.append("rect").attr("x", m.l).attr("y", m.t).attr("width", W - m.l - m.r).attr("height", H - m.t - m.b).attr("fill", "transparent").style("cursor", "crosshair");
        if (intro) linesIn(svg, 1400);
        var nearest = function (mx) { return Math.max(0, Math.min(pts.length - 1, Math.round(x.invert(mx)))); }, dragFrom = null;
        overlay.on("mousemove", function (ev) {
            var mx = d3.pointer(ev)[0], i = nearest(mx), p = pts[i];
            cross.attr("x1", x(i)).attr("x2", x(i)).style("display", null);
            if (dragFrom !== null) { var a = Math.min(dragFrom, i), b = Math.max(dragFrom, i); brush.attr("x", x(a - 0.5)).attr("width", x(b + 0.5) - x(a - 0.5)).style("display", null); }
            tip(p, ev);
        }).on("mouseleave", function () { cross.style("display", "none"); tip(null); })
          .on("mousedown", function (ev) { dragFrom = nearest(d3.pointer(ev)[0]); ev.preventDefault(); })
          .on("mouseup", function (ev) {
              if (dragFrom === null) return;
              var i = nearest(d3.pointer(ev)[0]), a = Math.min(dragFrom, i), b = Math.max(dragFrom, i); dragFrom = null; brush.style("display", "none");
              var px = Math.abs(x(i) - x(a === i ? b : a));
              ev.stopPropagation();
              selectRange(a, b, ev.shiftKey || ev.ctrlKey || ev.metaKey);
          });
    }
    function tip(p, ev) {
        var el = document.getElementById("tooltip");
        if (!p) { el.style.display = "none"; return; }
        var ph = S.phases[p.phase];
        el.innerHTML = '<b>' + esc(niceLabel(p)) + '</b><br><span class="k">' + esc(S.valueName) + ':</span> <b>' + fmt(p.v) + '</b>' +
            '<br><span class="k">Mean:</span> ' + fmt(ph.mean) + ' <span class="k">Limits:</span> ' + fmt(ph.lcl) + ' to ' + fmt(ph.ucl) +
            (p.mr !== null ? '<br><span class="k">Moving range:</span> ' + fmt(p.mr) : '') +
            (p.flags.length ? '<br><span style="color:' + C[p.cause] + ';font-weight:bold">' + esc(p.flags.join("; ")) + '</span>' : '<br><span class="k">Common cause</span>');
        el.style.display = "block";
        var box = document.getElementById("chart").getBoundingClientRect(), xx = ev.clientX - box.left + 14, yy = ev.clientY - box.top + 14;
        if (xx + el.offsetWidth > box.width - 4) xx = ev.clientX - box.left - el.offsetWidth - 14;
        if (yy + el.offsetHeight > box.height - 4) yy = Math.max(4, ev.clientY - box.top - el.offsetHeight - 14);
        el.style.left = Math.max(4, xx) + "px"; el.style.top = yy + "px";
    }

    // ------------------------------------------------------------ selection
    function timeFilter(a, b) {
        var f = S.timeField, pa = S.points[a], pb = S.points[b];
        if (pa.t.range) return { type: "AND", filters: [{ type: "FIELD_VALUE", inputField: f, operator: ">=", value: pa.raw.lower }, { type: "FIELD_VALUE", inputField: f, operator: "<", value: pb.raw.upper }] };
        if (a === b) return { type: "FIELD_VALUE", inputField: f, operator: "=", value: pa.raw };
        if (pa.t.sort !== null) return { type: "AND", filters: [{ type: "FIELD_VALUE", inputField: f, operator: ">=", value: pa.raw }, { type: "FIELD_VALUE", inputField: f, operator: "<=", value: pb.raw }] };
        return { type: "OR", filters: S.points.slice(a, b + 1).map(function (p) { return { type: "FIELD_VALUE", inputField: f, operator: "=", value: p.raw }; }) };
    }
    function selectRange(a, b, additive) {
        var keys = S.points.slice(a, b + 1).map(function (p) { return p.key; });
        if (!additive) S.selected = new Set();
        keys.forEach(function (k) { S.selected.add(k); });
        var f = timeFilter(a, b);
        if (additive && S.prevFilter) f = { type: "OR", filters: [S.prevFilter, f] };
        S.prevFilter = f;
        omniscope.view.context().viewSelection = { filter: f, meta: { keys: Array.from(S.selected) } };
        omniscope.view.updated();
        draw();
    }
    function restoreSelection(ctx) {
        var sel = ctx.viewSelection;
        S.selected = new Set(sel && sel.meta && sel.meta.keys ? sel.meta.keys : []);
        if (!sel) S.prevFilter = null;
    }
    document.body.addEventListener("click", function (e) {
        if (e.target.closest && e.target.closest("svg") && e.target.tagName === "rect") return;
        if (S.selected.size) { S.selected = new Set(); S.prevFilter = null; draw(); }
        omniscope.view.whitespaceClick();
    });
    window.__spc.selectRange = selectRange;

    omniscope.view.on(["load", "update"], render);
    omniscope.view.on("resize", function () { if (S.points.length) { document.body.classList.toggle("compact", window.innerHeight < 260 || window.innerWidth < 420); draw(); } else render(); });
})();
</script>
</body>
