<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            font-family: Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 12px; color: #0b0b0b; background: #fcfcfb;
            --ink2: #52514e; --muted: #898781; --line: #e1e0d9; --bar: #9ec5f4; --barSel: #2a78d6; --ring: rgba(11,11,11,0.10);
            overflow: hidden;
        }
        #main { position: absolute; inset: 0; overflow: auto; }
        #tree { position: relative; display: flex; gap: 46px; padding: 14px 18px 18px; min-height: calc(100% - 32px); align-items: flex-start; }
        svg#links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
        .col { width: 210px; flex: none; position: relative; z-index: 1; }
        .head { display: flex; align-items: baseline; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 5px; margin-bottom: 8px; min-height: 30px; }
        .head .t { font-weight: bold; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .head .sub { color: var(--muted); font-size: 11px; display: block; font-weight: normal; }
        .head .x { cursor: pointer; color: var(--muted); padding: 0 3px; border-radius: 3px; }
        .head .x:hover { color: #0b0b0b; background: rgba(127,127,127,.12); }
        .node { position: relative; padding: 4px 26px 5px 6px; border-radius: 5px; cursor: pointer; margin-bottom: 2px; }
        .node:hover { background: rgba(127,127,127,0.08); }
        .node .lab { display: flex; gap: 6px; align-items: baseline; }
        .node .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .node .v { font-variant-numeric: tabular-nums; font-weight: bold; }
        .node .pc { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
        .node .track { height: 8px; margin-top: 3px; position: relative; }
        .node .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
        .node.on .fill { background: var(--barSel); }
        .node.on .nm { font-weight: bold; }
        .node.other { cursor: default; color: var(--ink2); }
        .node.other .fill { background: #e1e0d9; }
        .node.selected { outline: 1px dashed #2161D9; outline-offset: -1px; }
        .plus {
            position: absolute; right: 2px; top: 50%; margin-top: -10px; width: 20px; height: 20px; border-radius: 50%;
            border: 1px solid var(--ring); background: #fff; color: var(--ink2); font-size: 15px; line-height: 18px; text-align: center; display: none;
        }
        .node:hover .plus, .node.on .plus { display: block; }
        .plus:hover { color: #fff; background: var(--barSel); border-color: var(--barSel); }
        .root .big { font-size: 26px; font-weight: bold; margin: 2px 0 2px; font-variant-numeric: tabular-nums; }
        .loading { color: var(--muted); padding: 6px; }
        #menu { position: fixed; display: none; z-index: 10; background: #fff; border: 1px solid var(--ring); box-shadow: 0 6px 18px rgba(0,0,0,.16); border-radius: 6px; padding: 4px 0; min-width: 180px; max-height: 70%; overflow: auto; }
        #menu .mi { padding: 6px 12px; cursor: pointer; white-space: nowrap; }
        #menu .mi:hover { background: #eef4fd; }
        #menu .sep { border-top: 1px solid var(--line); margin: 4px 0; }
        #menu .hint { color: var(--muted); font-size: 11px; padding: 2px 12px 4px; }
        #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--ink2); font-size: 14px; padding: 20px; background: #fcfcfb; z-index: 6; }
    </style>
</head>

<body>

<div id="menu"></div>

    // ------------------------------------------------------------ split menu
    function openMenu(e, level, value) {
        var m = document.getElementById("menu"), used = S.levels.slice(1, level + 1).map(function (x) { return x.dim; });
        var cand = dims().filter(function (d) { return used.indexOf(d) < 0; });
        var h = '<div class="hint">Split ' + esc(level ? label(value) : "the total") + ' by</div>';
        if (opts().autoSplits !== false && cand.length > 1) h += '<div class="mi" data-auto="hi">Auto: highest value</div><div class="mi" data-auto="lo">Auto: lowest value</div><div class="sep"></div>';
        cand.forEach(function (d) { h += '<div class="mi" data-dim="' + esc(d) + '">' + esc(d) + '</div>'; });
        m.innerHTML = h; m.style.display = "block";
        var x = Math.min(e.clientX + 8, window.innerWidth - m.offsetWidth - 6), y = Math.min(e.clientY - 10, window.innerHeight - m.offsetHeight - 6);
        m.style.left = Math.max(4, x) + "px"; m.style.top = Math.max(4, y) + "px";
        Array.prototype.forEach.call(m.querySelectorAll(".mi"), function (it) {
            it.addEventListener("click", function (ev) {
                ev.stopPropagation(); m.style.display = "none";
                if (it.getAttribute("data-auto")) autoSplit(level, value, it.getAttribute("data-auto") === "hi"); else expand(level, value, it.getAttribute("data-dim"));
            });
        });
    }
    document.addEventListener("click", function () { document.getElementById("menu").style.display = "none"; });
    document.getElementById("main").addEventListener("click", function (e) { if (e.target.id === "main" || e.target.id === "tree" || e.target.tagName === "svg") clearSelection(); });

    // ------------------------------------------------------------ lifecycle
    function render(isLoad) {
        var it = opts();
        S.sig = JSON.stringify(it) + "|" + JSON.stringify(viewFilter());
        if (!it.measure) { message("Choose a measure to Analyse, and one or more fields to Explain by."); return; }
        if (!dims().length) { message("Add one or more fields to Explain by. Then use + on any bar to split it."); return; }
        message(null);
        var valid = dims();
        if (!S.levels.length || isLoad) {
            S.levels = [{ total: null }];
            restore().forEach(function (L) { if (valid.indexOf(L.dim) >= 0 && !S.levels.some(function (x) { return x.dim === L.dim; })) S.levels.push({ dim: L.dim, sel: L.sel === null ? null : L.sel, rows: [] }); });
        } else {
            for (var i = 1; i < S.levels.length; i++) if (valid.indexOf(S.levels[i].dim) < 0) { S.levels.length = i; break; }
        }
        var sel = omniscope.view.context().viewSelection; if (!sel) S.selected = null;
        draw(); refresh(0);
    }
    omniscope.view.on("load", function () { render(true); });
    omniscope.view.on("update", function () { render(false); });
    omniscope.view.on("resize", function () { requestAnimationFrame(drawLinks); });
})();
</script>
