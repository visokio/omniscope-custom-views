    function tipEdge(e, ev) { var M = S.model; show('<b>' + esc(e.a) + ' &rarr; ' + esc(e.b) + '</b><br><span class="k">Cases:</span> ' + e.cases.size.toLocaleString() + ' (' + (100 * e.cases.size / M.ncase).toFixed(1) + '%)' + (e.n > e.cases.size ? '<br><span class="k">Times:</span> ' + e.n.toLocaleString() : '') + (e.dn ? '<br><span class="k">Average time:</span> ' + dur(e.dsum / e.dn) : ''), ev); }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }
    function casesFilter(raws) { var F = S.model.F, eq = function (v) { return { type: "FIELD_VALUE", inputField: F.c, operator: "=", value: v }; }; return raws.length === 1 ? eq(raws[0]) : { type: "OR", filters: raws.map(eq) }; }
    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(false); }
    function capped(keys) { if (keys.length > 3000) { omniscope.view.error(keys.length.toLocaleString() + " cases; selection is limited to 3,000."); return null; } var M = S.model; return keys.map(function (k) { return M.cases.get(k).raw; }); }
    function selectActivity(A) { if (S.sel && S.sel.activity === A.name) return publish(null, null); publish({ type: "FIELD_VALUE", inputField: S.model.F.a, operator: "=", value: A.name }, { activity: A.name }); }
    function selectEdge(e) { if (S.sel && S.sel.edge === e.k) return publish(null, null); var r = capped(Array.from(e.cases)); if (r) publish(casesFilter(r), { edge: e.k }); }
    function selectVariant(i) { if (S.sel && S.sel.variant === i) return publish(null, null); var v = S.model.variants[i]; if (v.cases.length > 3000) { omniscope.view.error("Selection is limited to 3,000 cases."); return; } publish(casesFilter(v.cases), { variant: i }); }
    window.__proc.selectVariant = selectVariant; window.__proc.selectActivity = function (n) { selectActivity(S.model.nodes.get(n)); }; window.__proc.setDetail = function (d) { S.detail = d; draw(false); };
    document.getElementById("detail").addEventListener("input", function () { S.detail = +this.value; draw(false); });
    document.getElementById("mFreq").addEventListener("click", function (e) { e.stopPropagation(); S.metric = "FREQUENCY"; draw(false); });
    document.getElementById("mDur").addEventListener("click", function (e) { e.stopPropagation(); S.metric = "DURATION"; draw(false); });
    document.getElementById("bar").addEventListener("click", function (e) { e.stopPropagation(); });
    document.getElementById("map").addEventListener("click", function () { if (S.sel) publish(null, null); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(true); });
})();
</script>
