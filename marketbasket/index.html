        top.forEach(function (r, i) {

            h += '<div class="rule' + (isSel ? " sel" : "") + '" data-a="' + r.a + '" data-b="' + r.b + '"><div class="r">' + esc(A) + ' \u2192 ' + esc(B) + '</div><div class="m">' + pct(r.conf) + ' of baskets with ' + esc(A) + ' also have ' + esc(B) + '; lift ' + lx(r.lift) + '; ' + r.c.toLocaleString() + ' baskets (' + pct(r.sup) + ')</div><div class="bar" style="width:' + Math.max(3, 260 * r[key] / mx) + 'px"></div></div>';
        });
        h += '<div class="note">Click an item to focus on its rules and select its lines; click a cell or a rule to select the baskets containing both items.</div>';
        el.innerHTML = h;
        Array.prototype.forEach.call(el.querySelectorAll(".rule"), function (d) {
            d.addEventListener("click", function (e) { e.stopPropagation(); selectPair(+d.getAttribute("data-a"), +d.getAttribute("data-b")); });
            d.addEventListener("mouseenter", function (e) { tipCell(+d.getAttribute("data-a"), +d.getAttribute("data-b"), e, true); }); d.addEventListener("mouseleave", tip);
        });
        var u = document.getElementById("unfocus"); if (u) u.addEventListener("click", function (e) { e.stopPropagation(); S.focus = null; if (S.sel && S.sel.item !== undefined) publish(null, null); else draw(); });
    }

    function tipCell(a, b, ev, isRule) {
        var M = S.model, n = M.n, A = M.items[a], B = M.items[b], c = M.pair[a * n + b], l = M.lift[a * n + b];
        var h = '<b>' + esc(A.name) + ' &amp; ' + esc(B.name) + '</b><br><span class="k">Together in</span> ' + c.toLocaleString() + ' baskets (' + pct(c / M.nb) + ')';
        if (c < M.minCount) h += '<br><span class="k">Too few baskets to judge (minimum ' + M.minCount.toLocaleString() + ')</span>';
        else h += '<br><span class="k">Lift</span> ' + lx(l) + (l >= 1.2 ? ': bought together more often than chance' : l <= 0.83 ? ': bought together less often than chance' : ': about as often as chance') +
            '<br>' + pct(c / A.n) + ' of baskets with ' + esc(A.name) + ' also have ' + esc(B.name) + '<br>' + pct(c / B.n) + ' of baskets with ' + esc(B.name) + ' also have ' + esc(A.name);
        show(h, ev, isRule);
    }
    function tipItem(k, ev) { var M = S.model, I = M.items[k]; show('<b>' + esc(I.name) + '</b>' + (I.g ? ' <span class="k">(' + esc(I.g) + ')</span>' : '') + '<br><span class="k">In</span> ' + I.n.toLocaleString() + ' baskets (' + pct(I.s) + ')', ev); }
    function show(html, ev, left) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = left ? Math.max(4, window.innerWidth - 310 - el.offsetWidth) : ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    function selectItem(k) {
        var M = S.model, name = M.items[k].name;
        if (S.focus === name) { S.focus = null; return publish(null, null); }
        S.focus = name; publish({ type: "FIELD_VALUE", inputField: M.F.i, operator: "=", value: name }, { item: name });
    }
    function selectPair(a, b) {
        var M = S.model, A = M.items[a].name, B = M.items[b].name;
        if (S.sel && S.sel.pair && S.sel.pair[0] === A && S.sel.pair[1] === B) return publish(null, null);
        var raws = []; M.baskets.forEach(function (bk) { if (bk.items.has(A) && bk.items.has(B)) raws.push(bk.raw); });
        if (!raws.length) return;
        if (raws.length > 3000) { omniscope.view.error(raws.length.toLocaleString() + " baskets; selection is limited to 3,000."); return; }
        var eq = function (v) { return { type: "FIELD_VALUE", inputField: M.F.b, operator: "=", value: v }; };
        publish(raws.length === 1 ? eq(raws[0]) : { type: "OR", filters: raws.map(eq) }, { pair: [A, B] });
    }
    window.__basket.selectPair = function (A, B) { var M = S.model, f = function (n) { return M.items.find(function (I) { return I.name === n; }).k; }; selectPair(f(A), f(B)); };
    window.__basket.selectItem = function (A) { selectItem(S.model.items.find(function (I) { return I.name === A; }).k); };
    window.__basket.liftOf = function (A, B) { var M = S.model, f = function (n) { return M.items.find(function (I) { return I.name === n; }).k; }; return M.lift[f(A) * M.n + f(B)]; };

    document.getElementById("mat").addEventListener("click", function () { S.focus = null; if (S.sel) publish(null, null); else draw(); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
</body>
</html>
