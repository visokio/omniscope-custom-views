        .stat span { color: var(--ink2); font-size: 11px; }

        .row:hover { background: rgba(127,127,127,0.12); }
        .row.sel { outline: 1px dashed #2161D9; }
        .row .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }

        input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 4px; background: #fff; }
        button { font: inherit; padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; background: #fff; cursor: pointer; color: var(--ink2); }
        button:hover { color: var(--ink); }
        #pathResult { color: var(--ink2); margin-top: 4px; line-height: 1.4; }
        #tooltip {
            position: absolute; display: none; pointer-events: none; z-index: 5; background: rgba(252,252,251,0.96);
            border: 1px solid var(--ring); box-shadow: 0 4px 14px rgba(0,0,0,0.15); border-radius: 6px; padding: 8px 10px; line-height: 1.45; white-space: nowrap;
        }
        #tooltip .k { color: var(--ink2); }
        #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--ink2); font-size: 14px; padding: 20px; background: var(--surface); z-index: 6; }
        #status { position: absolute; left: 8px; bottom: 6px; color: var(--muted); font-size: 11px; pointer-events: none; }
        #focusBar { position: absolute; left: 8px; top: 8px; display: none; gap: 6px; align-items: center; background: rgba(252,252,251,0.92); border: 1px solid var(--ring); border-radius: 6px; padding: 4px 8px; }
    </style>

</head>

            '<div class="stat"><b>' + model.modularity.toFixed(2) + '</b><span>modularity</span></div></div>' +
            '<div style="color:var(--muted);margin-top:4px">Density ' + (dens * 100).toFixed(2) + '%</div>';
        h += '<h3>Find a node</h3><input id="search" type="text" list="nodeList" placeholder="Type a name"><datalist id="nodeList">' +
            model.ranked.slice(0, 2000).map(function (d) { return '<option value="' + esc(d.id) + '">'; }).join("") + '</datalist>';
        h += '<h3>Most central: ' + esc(METRIC_LABEL[model.metric]) + '</h3>';
        var top = model.ranked.slice(0, 10), mx = top.length ? top[0].m || 1 : 1;
        top.forEach(function (d) {
            h += '<div class="row node' + (S.selected.has(d.key) ? " sel" : "") + '" data-i="' + d.i + '"><span class="sw" style="background:' + colourOf(d) + '"></span><span class="nm" title="' + esc(d.id) + '">' + esc(d.id) + '</span><span class="v">' + fmt(d.m) + '</span></div>' +
                '<div class="bar" style="width:' + Math.max(2, 190 * d.m / mx) + 'px"></div>';
        });
        if (S.colourBy !== "NONE") {
            h += '<h3>Communities</h3>';
            model.communities.slice(0, 8).forEach(function (c) {
                var hub = c.members.slice().sort(function (a, b) { return b.m - a.m; })[0];
                h += '<div class="row comm" data-c="' + c.index + '"><span class="sw" style="background:' + PALETTE[c.index] + '"></span><span class="nm">Around ' + esc(hub.id) + '</span><span class="v">' + c.size + '</span></div>';
            });
            if (model.communities.length > 8) h += '<div class="row" style="cursor:default"><span class="sw" style="background:' + OTHER + '"></span><span class="nm">' + (model.communities.length - 8) + ' smaller</span><span class="v">' + model.communities.slice(8).reduce(function (a, c) { return a + c.size; }, 0) + '</span></div>';
        }
        h += '<h3>Shortest path</h3><input id="pathA" type="text" list="nodeList" placeholder="From"><input id="pathB" type="text" list="nodeList" placeholder="To"><button id="pathGo">Find path</button> <button id="pathClear">Clear</button><div id="pathResult"></div>';
        el.innerHTML = h;
        el.querySelectorAll(".row.node").forEach(function (r) { r.addEventListener("click", function (e) { e.stopPropagation(); var d = S.nodes[+r.getAttribute("data-i")]; focusNode(d.i); selectNodes([d], e.shiftKey || e.ctrlKey || e.metaKey); }); });
        el.querySelectorAll(".row.comm").forEach(function (r) { r.addEventListener("click", function (e) { e.stopPropagation(); selectCommunity(+r.getAttribute("data-c")); }); });
        var byName = function (v) { return S.nodes.find(function (d) { return d.key === v; }) || S.nodes.find(function (d) { return d.key.toLowerCase() === String(v).toLowerCase(); }); };
        document.getElementById("search").addEventListener("change", function () { var d = byName(this.value); if (d) { focusNode(d.i); zoomTo(d); } });
        document.getElementById("pathGo").addEventListener("click", function (e) {
            e.stopPropagation();
            var a = byName(document.getElementById("pathA").value), b = byName(document.getElementById("pathB").value), out = document.getElementById("pathResult");
            if (!a || !b) { out.textContent = "Choose two nodes from the list."; return; }
            showPath(a, b);
        });
        document.getElementById("pathClear").addEventListener("click", function (e) { e.stopPropagation(); S.path = null; document.getElementById("pathResult").textContent = ""; draw(); });
        el.addEventListener("click", function (e) { e.stopPropagation(); });
    }
    function showPath(a, b) {
        var p = shortestPath(a.i, b.i, S.model.dnbrs), out = document.getElementById("pathResult");
        if (!p) { S.path = null; out.textContent = "No path between these nodes" + (S.directed ? " in the link direction." : "."); draw(); return; }
        S.path = p; S.pathSet = new Set(p); S.pathLinks = new Set(); for (var i = 1; i < p.length; i++) S.pathLinks.add(p[i - 1] + "-" + p[i]);
        S.focus = null; updateFocusBar();
        if (out) out.innerHTML = (p.length - 1) + " step" + (p.length === 2 ? "" : "s") + ": " + p.map(function (i) { return esc(S.nodes[i].id); }).join(" &rarr; ");
        draw();
        return p;
    }
    window.__network.showPath = function (a, b) { var x = S.nodes.find(function (d) { return d.key === a; }), y = S.nodes.find(function (d) { return d.key === b; }); return x && y ? showPath(x, y) : null; };

    // ================================================================ selection and focus
    function recomputeSelNeighbours() { S.selNeighbours = new Set(); S.nodes.forEach(function (d) { if (S.selected.has(d.key)) S.model.nbrs[d.i].forEach(function (j) { S.selNeighbours.add(j); }); }); }
    function publish(filter) { omniscope.view.context().viewSelection = filter ? { filter: filter } : null; omniscope.view.updated(); }
    function eqF(field, v) { return { type: "FIELD_VALUE", inputField: field, operator: "=", value: v }; }
    function selectNodes(list, additive) {
        if (!additive) S.selected = new Set();
        list.forEach(function (d) { if (additive && S.selected.has(d.key) && list.length === 1) S.selected.delete(d.key); else S.selected.add(d.key); });
        recomputeSelNeighbours(); draw(); panel(S.model);
        if (!S.selected.size) return publish(null);
        var f = S.model.fields, parts = [];
        S.nodes.forEach(function (d) { if (S.selected.has(d.key)) { parts.push(eqF(f.source, d.id)); parts.push(eqF(f.target, d.id)); } });
        publish({ type: "OR", filters: parts });
    }
    function selectCommunity(ci) {
        var c = S.model.communities[ci], f = S.model.fields;
        S.selected = new Set(c.members.map(function (d) { return d.key; })); recomputeSelNeighbours(); S.focus = null; updateFocusBar(); draw(); panel(S.model);
        // Links inside the community: From is a member AND To is a member.
        publish({ type: "AND", filters: [{ type: "OR", filters: c.members.map(function (d) { return eqF(f.source, d.id); }) }, { type: "OR", filters: c.members.map(function (d) { return eqF(f.target, d.id); }) }] });
    }
    function restoreSelection(ctx) {
        S.selected = new Set();
        var sel = ctx.viewSelection, f = sel && (sel.filter || (sel.type ? sel : null)), fs = S.model.fields;
        (function walk(x) { if (!x) return; if (x.filters) x.filters.forEach(walk); if ((x.inputField === fs.source || x.inputField === fs.target) && x.value !== undefined) S.selected.add(String(x.value)); })(f);
        recomputeSelNeighbours();
    }
    function focusNode(i) {
        S.focus = i; S.path = null; S.focusSet = new Set(S.model.nbrs[i]);
        updateFocusBar(); draw();
    }
    function updateFocusBar() {
        var b = document.getElementById("focusBar");
        if (S.focus === null) { b.style.display = "none"; return; }
        var d = S.nodes[S.focus];
        document.getElementById("focusText").textContent = "Neighbourhood of " + d.id + " (" + S.focusSet.size + " connections)";
        b.style.display = "flex";
    }
    function zoomTo(d) { var k = Math.max(1.5, S.transform.k); d3.select(canvas).transition().duration(500).call(S.zoom.transform, d3.zoomIdentity.translate(W / 2 - k * d.x, H / 2 - k * d.y).scale(k)); }
    document.getElementById("clearFocus").addEventListener("click", function (e) { e.stopPropagation(); S.focus = null; updateFocusBar(); draw(); });

    // ================================================================ pointer
    function hit(mx, my) {
        var t = S.transform, x = (mx - t.x) / t.k, y = (my - t.y) / t.k, best = null, bd = Infinity;
        S.nodes.forEach(function (d) { var dd = (d.x - x) * (d.x - x) + (d.y - y) * (d.y - y), rr = Math.pow(d.r + 4 / t.k, 2); if (dd < rr && dd < bd) { bd = dd; best = d; } });
        return best;
    }
    function tip(d, ev) {
        var el = document.getElementById("tooltip");
        if (!d) { el.style.display = "none"; return; }
        var m = S.model;
        el.innerHTML = '<b>' + esc(d.id) + '</b><br><span class="k">Connections:</span> ' + d.degree +
            (m.fields.weight ? '<br><span class="k">' + esc(m.fields.weight) + ' (total):</span> ' + fmt(d.wdegree) : '') +
            '<br><span class="k">Betweenness:</span> ' + d.betweenness.toFixed(4) + '<br><span class="k">PageRank:</span> ' + d.pagerank.toFixed(4) +
            (S.colourBy !== "NONE" ? '<br><span class="k">Community:</span> ' + (d.comm + 1) + ' of ' + m.communities.length : '') +
            '<br><span class="k">Rank by ' + esc(METRIC_LABEL[m.metric]) + ':</span> ' + d.rank + ' of ' + m.nodes.length;
        el.style.display = "block";
        var x = ev.clientX + 14, y = ev.clientY + 14;
        if (x + el.offsetWidth > window.innerWidth - 4) x = ev.clientX - el.offsetWidth - 14;
        if (y + el.offsetHeight > window.innerHeight - 4) y = ev.clientY - el.offsetHeight - 14;
        el.style.left = Math.max(4, x) + "px"; el.style.top = Math.max(4, y) + "px";
    }
    var dragNode = null, downAt = null;
    S.zoom = d3.zoom().scaleExtent([0.05, 12])
        .filter(function (ev) { if (ev.type === "mousedown" || ev.type === "pointerdown") { var r = canvas.getBoundingClientRect(); return !hit(ev.clientX - r.left, ev.clientY - r.top); } return !ev.button; })
        .on("zoom", function (ev) { S.transform = ev.transform; draw(); });
    d3.select(canvas).call(S.zoom).on("dblclick.zoom", null);
    canvas.addEventListener("pointerdown", function (ev) {
        var r = canvas.getBoundingClientRect(), d = hit(ev.clientX - r.left, ev.clientY - r.top);
        downAt = { x: ev.clientX, y: ev.clientY, d: d };
        if (d) { dragNode = d; }
    });
    window.addEventListener("pointermove", function (ev) {
        var r = canvas.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
        if (dragNode && downAt && Math.abs(ev.clientX - downAt.x) + Math.abs(ev.clientY - downAt.y) > 3) {
            var t = S.transform; dragNode.x = dragNode.fx = (mx - t.x) / t.k; dragNode.y = dragNode.fy = (my - t.y) / t.k;
            if (S.sim) S.sim.alpha(0.15).restart(); tip(null); return;
        }
        if (ev.target !== canvas) return;
        var d = hit(mx, my);
        if (d !== S.hover) { S.hover = d; draw(); }
        canvas.style.cursor = d ? "pointer" : "default";
        tip(d, ev);
    });
    window.addEventListener("pointerup", function (ev) {
        var wasDrag = dragNode && downAt && Math.abs(ev.clientX - downAt.x) + Math.abs(ev.clientY - downAt.y) > 3;
        if (dragNode) { dragNode.fx = dragNode.fy = null; }
        var start = downAt; dragNode = null; downAt = null;
        if (!start || wasDrag || ev.target !== canvas) return;
        if (Math.abs(ev.clientX - start.x) + Math.abs(ev.clientY - start.y) > 3) return;
        if (start.d) { focusNode(start.d.i); selectNodes([start.d], ev.shiftKey || ev.ctrlKey || ev.metaKey); }
        else { S.selected = new Set(); recomputeSelNeighbours(); S.focus = null; S.path = null; updateFocusBar(); draw(); panel(S.model); omniscope.view.whitespaceClick(); }
    });
    canvas.addEventListener("pointerleave", function () { S.hover = null; tip(null); draw(); });

    // ================================================================ main
    function render() {
        var ctx = omniscope.view.context(), it = ctx.options.items;
        document.body.classList.toggle("panel", it.showPanel !== false && window.innerWidth > 560);
        if (!it.source || !it.target) { message("Choose From and To fields: each row is a link between two items."); return; }
        if (!ctx.result || !ctx.result.data) { message("Waiting for data"); return; }
        var model = build(ctx);
        if (!model.nodes.length) { message(ctx.result.data.records.length ? "No links pass the minimum link weight." : "No data to show. Check the filters."); document.getElementById("panel").innerHTML = ""; return; }
        message(null);
        sizeCanvas();
        var prev = {}; S.nodes.forEach(function (d) { prev[d.key] = { x: d.x, y: d.y }; });
        var sameShape = S.key === gField(it.source) + "|" + gField(it.target);
        S.model = model; S.nodes = model.nodes; S.links = model.links; S.directed = model.directed;
        S.colourBy = it.colourBy || "COMMUNITY"; S.labelMode = it.labels || "TOP"; S.labelCount = it.labelCount === undefined || it.labelCount === null ? 12 : +it.labelCount;
        S.focus = null; S.path = null; updateFocusBar();
        restoreSelection(ctx);
        layout(model, sameShape && S.nodes.length ? prev : null);
        if (!sameShape || !S.fitted) { fit(); S.fitted = true; }
        S.key = gField(it.source) + "|" + gField(it.target);
        panel(model); draw();
        document.getElementById("status").textContent = model.nodes.length > 1500 ? "Betweenness estimated from a sample of 400 nodes" : "";
    }
    omniscope.view.on(["load", "update"], render);
    omniscope.view.on("resize", function () {
        if (!S.model) return render();
        document.body.classList.toggle("panel", omniscope.view.context().options.items.showPanel !== false && window.innerWidth > 560);
        sizeCanvas(); fit(); draw();
    });
    document.body.addEventListener("click", function (e) { if (e.target === document.body || e.target.id === "message") omniscope.view.whitespaceClick(); });
})();
</script>
</body>
</html>
