<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { font-family: Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 12px; color: #0b0b0b; background: #fcfcfb; }
        #main { position: absolute; inset: 0; display: flex; }
        #chart { flex: 1; position: relative; min-width: 0; }
        #side { width: 250px; flex: none; background: #f6f6f3; border-left: 1px solid #e1e0d9; overflow: auto; padding: 10px 12px; box-sizing: border-box; }
        body.narrow #side { display: none; }
        svg { display: block; position: absolute; left: 0; top: 0; }
        .cell { cursor: pointer; } .cell:hover rect { stroke: #0b0b0b; stroke-width: 1.5; }
        h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #52514e; margin: 12px 0 6px; } h3:first-child { margin-top: 0; }
        .stat { color: #52514e; margin-bottom: 5px; line-height: 1.45; } .stat b { color: #0b0b0b; font-size: 15px; }
        .note { color: #898781; font-size: 11px; margin-top: 8px; line-height: 1.4; }
        #tooltip { position: absolute; display: none; pointer-events: none; background: rgba(252,252,251,.97); border: 1px solid rgba(11,11,11,.1); box-shadow: 0 4px 14px rgba(0,0,0,.15); border-radius: 6px; padding: 6px 9px; line-height: 1.45; white-space: nowrap; z-index: 5; }
        #tooltip .k { color: #52514e; }
        #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #52514e; font-size: 14px; padding: 20px; background: #fcfcfb; z-index: 6; }
    </style>

    <!-- Put SCRIPT tags to load 3rd party libraries here -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>

<body>
<div id="main"><!-- This element is where the view will render -->
    <div id="chart"><svg id="svg"></svg></div>
    <div id="side"></div>
</div>
<div id="tooltip"></div>
<div id="message"></div>

<script src="/_global_/customview/v1/omniscope.js"></script><!-- Add the Omniscope custom view API -->

<script>
(function () {
    if (!omniscope || !omniscope.view) throw new Error("Omniscope chart API is not loaded");
    omniscope.view.on("load", function () { window.onerror = function (msg) { omniscope.view.error(msg); }; });

    // Entrance animation: plays when new data arrives (first load, a filter or an option change), not when hovering or
    // selecting; skipped when the viewer has asked the system for reduced motion.
    var MOTION = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches), INTRO = { on: false, sig: null };
    function introIf(sig) { if (sig !== INTRO.sig) { INTRO.sig = sig; INTRO.on = true; } }
    function introDone() { var now = Date.now(); if (INTRO.on && MOTION) { INTRO.on = false; INTRO.t = now; return true; } return MOTION && INTRO.t && now - INTRO.t < 300; } // a redraw right after the entrance (e.g. a resize) replays it
    function ease(t) { return t.duration(t.duration ? t.duration() : 600).ease(d3.easeCubicOut); }
    function stag(n, total) { return Math.min(40, (total || 700) / Math.max(1, n)); }
    function fadeIn(sel, ms, stagger) { sel.each(function (d, i) { var e = d3.select(this), o = e.attr("opacity"); e.attr("opacity", 0).transition().delay(i * (stagger || 0)).duration(ms).attr("opacity", o === null ? 1 : o); }); }
    function drawIn(sel, ms, delay) { sel.each(function () { var L = this.getTotalLength ? this.getTotalLength() : 0, e = d3.select(this); if (!L || e.attr("stroke-dasharray")) return; e.attr("stroke-dasharray", L + " " + L).attr("stroke-dashoffset", L).transition().delay(delay || 0).duration(ms).ease(d3.easeCubicOut).attr("stroke-dashoffset", 0).on("end", function () { d3.select(this).attr("stroke-dasharray", null).attr("stroke-dashoffset", null); }); }); }
    function growUp(sel, ms, stagger) { sel.each(function (d, i) { var e = d3.select(this), y = +e.attr("y"), h = +e.attr("height"); e.attr("y", y + h).attr("height", 0).transition().delay(i * (stagger || 0)).duration(ms).ease(d3.easeCubicOut).attr("y", y).attr("height", h); }); }
    function growRight(sel, ms, stagger) { sel.each(function (d, i) { var e = d3.select(this), w = +e.attr("width"); e.attr("width", 0).transition().delay(i * (stagger || 0)).duration(ms).ease(d3.easeCubicOut).attr("width", w); }); }
    // bars that know their zero line (data-z, data-o = h or v) grow out of it in the right direction
    function growZ(sel, ms, stagger) { sel.each(function (d, i) { var e = d3.select(this), z = +e.attr("data-z"), v = e.attr("data-o") === "v", t; if (isNaN(z)) return; if (v) { var y = +e.attr("y"), h = +e.attr("height"); e.attr("y", y < z - 0.5 ? y + h : y).attr("height", 0); t = e.transition().delay(i * (stagger || 0)).duration(ms).ease(d3.easeCubicOut).attr("y", y).attr("height", h); } else { var x = +e.attr("x"), w = +e.attr("width"); e.attr("x", x < z - 0.5 ? x + w : x).attr("width", 0); t = e.transition().delay(i * (stagger || 0)).duration(ms).ease(d3.easeCubicOut).attr("x", x).attr("width", w); } }); }
    function popIn(sel, ms, stagger) { sel.each(function (d, i) { var e = d3.select(this), r = +e.attr("r"); if (isNaN(r)) return; e.attr("r", 0).transition().delay(i * (stagger || 0)).duration(ms).ease(d3.easeBackOut).attr("r", r); }); }
    // line charts: solid lines draw from left to right, filled areas and dashed lines fade in, points fade in
    function linesIn(root, ms) { ms = ms || 1000; root.selectAll("path").each(function () { var e = d3.select(this), f = e.attr("fill"), st = e.attr("stroke"); if (e.classed("domain") || st === "transparent" || !st && (!f || f === "none")) return; if ((f === "none") && !e.attr("stroke-dasharray")) drawIn(e, ms, 0); else fadeIn(e, ms * 0.7, 0); }); fadeIn(root.selectAll("circle"), ms * 0.6, 0); }

    var RAMP = ["#f2f7fd", "#c9def8", "#9ec5f4", "#6fa8ec", "#3987e5", "#2a6fc4", "#184f95"], UP = "#0b6b0b", DOWN = "#a32a2a", SELECT = "#2161D9", NEW = "(new)", GONE = "(gone)";
    var S = { gen: 0, sel: null };
    window.__trans = S;
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
    var pct = function (v) { return (100 * v).toFixed(v < 0.1 && v > 0 ? 1 : 0) + "%"; };
    function message(t) { var m = document.getElementById("message"); m.style.display = t ? "flex" : "none"; m.textContent = t || ""; }
    function it() { return omniscope.view.context().options.items || {}; }
    function fld(x) { return x ? (typeof x === "string" ? x : x.inputField) : null; }
    function label(v) { if (v === null || v === undefined) return "(blank)"; if (typeof v === "object" && "lower" in v) v = v.lower; return typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : String(v); }

    function load() {
        introIf(JSON.stringify(it()) + "|" + JSON.stringify(omniscope.view.context().dataConfig.filter || null));
        var o = it(), F = { i: fld(o.item), p: fld(o.period), s: fld(o.state) };
        if (!F.i || !F.p || !F.s) { message("Choose the Items (for example Customer), the Periods (for example Year) and the State in each period (for example Tier)."); return; }
        var q = { groupings: [{ inputField: F.i, type: "UNIQUE_VALUES" }, { inputField: F.p, type: "UNIQUE_VALUES" }, { inputField: F.s, type: "UNIQUE_VALUES" }], measures: [{ function: "RECORD_COUNT", name: "n" }], range: { start: 0, length: 1000000 } };
        var f = omniscope.view.context().dataConfig.filter; if (f && (!f.filters || f.filters.length)) q.filter = f;
        var gen = ++S.gen; omniscope.view.busy(true);
        omniscope.view.queryBuilder().table(q).on("load", function (e) { if (gen !== S.gen) return; omniscope.view.busy(false); build(F, e.data.records); draw(); })
            .on("error", function (e) { omniscope.view.busy(false); omniscope.view.error((e.data && e.data.message) || "Query failed", e.data); }).execute();
    }

    function build(F, recs) {
        var o = it();
        if (!recs.length) { S.model = null; message("No data to show. Check the filters."); return; }
        var periods = Array.from(new Set(recs.map(function (r) { return label(r[1]); }))).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
        if (periods.length < 2) { S.model = null; message("Transitions need two periods; the data has only " + periods[0] + "."); return; }
        var pick = function (t, d) { t = t === undefined || t === null ? "" : String(t).trim(); return periods.indexOf(t) >= 0 ? t : d; };
        var A = pick(o.from, periods[periods.length - 2]), B = pick(o.to, periods[periods.length - 1]);
        if (A === B) { S.model = null; message("From and To are the same period. Choose two different periods."); return; }
        // each item's state in each of the two periods (the most frequent if an item has several)
        var st = { a: new Map(), b: new Map() }, raws = new Map(), cnt = {};
        recs.forEach(function (r) { var p = label(r[1]); if (p !== A && p !== B) return; var k = String(r[0]), s = label(r[2]), side = p === A ? "a" : "b", key = side + "\u0001" + k + "\u0001" + s; raws.set(k, r[0]); cnt[key] = (cnt[key] || 0) + (+r[3] || 1); var cur = st[side].get(k); if (!cur || cnt[key] > cnt[side + "\u0001" + k + "\u0001" + cur]) st[side].set(k, s); });
        var states = Array.from(new Set(Array.from(st.a.values()).concat(Array.from(st.b.values()))));
        if (states.length > 30) { S.model = null; message("State has " + states.length + " different values. Choose a field with a few states, such as a tier, a rating or a segment."); return; }
        message(null);
        var custom = o.order ? String(o.order).split(",").map(function (s) { return s.trim(); }).filter(Boolean) : [];
        states.sort(function (x, y) { var i = custom.indexOf(x), j = custom.indexOf(y); if (i >= 0 || j >= 0) return (i < 0 ? 999 : i) - (j < 0 ? 999 : j); return x.localeCompare(y, undefined, { numeric: true }); });
        var rows = states.concat([NEW]), cols = states.concat([GONE]), cells = {}, rowTot = {};
        var add = function (f, t, k) { var key = f + "\u0001" + t; if (!cells[key]) cells[key] = { f: f, t: t, items: [] }; cells[key].items.push(k); rowTot[f] = (rowTot[f] || 0) + 1; };
        st.a.forEach(function (s, k) { add(s, st.b.has(k) ? st.b.get(k) : GONE, k); });
        st.b.forEach(function (s, k) { if (!st.a.has(k)) add(NEW, s, k); });
        var both = 0, stay = 0, up = 0, down = 0;
        st.a.forEach(function (s, k) { if (!st.b.has(k)) return; both++; var i = states.indexOf(s), j = states.indexOf(st.b.get(k)); if (i === j) stay++; else if (j < i) up++; else down++; });
        if (!rowTot[NEW]) rows = states.slice(); if (!st.a.size || Array.from(st.a.keys()).every(function (k) { return st.b.has(k); })) cols = states.slice(); // hide empty (new) and (gone)
        S.model = { F: F, A: A, B: B, states: states, rows: rows, cols: cols, cells: cells, rowTot: rowTot, raws: raws, both: both, stay: stay, up: up, down: down, nA: st.a.size, nB: st.b.size, gone: d3.sum(states, function (s) { var c = cells[s + "\u0001" + GONE]; return c ? c.items.length : 0; }), fresh: d3.sum(states, function (s) { var c = cells[NEW + "\u0001" + s]; return c ? c.items.length : 0; }), ordered: custom.length > 0 };
        var sel = omniscope.view.context().viewSelection; S.sel = sel && sel.meta ? sel.meta : null;
    }

    var svg = d3.select("#svg");
    function draw() {
        var M = S.model; tip();
        if (!M) { svg.selectAll("*").remove(); document.getElementById("side").innerHTML = ""; return; }
        document.body.classList.toggle("narrow", window.innerWidth < 640); var intro = introDone();
        var box = document.getElementById("chart"), W = box.clientWidth, H = box.clientHeight; svg.attr("width", W).attr("height", H); svg.selectAll("*").remove();
        var maxLab = d3.max(M.rows.concat(M.cols), function (s) { return s.length; }) || 4, L = Math.min(150, maxLab * 6.6 + 16), T = 64, nr = M.rows.length, nc = M.cols.length;
        var c = Math.floor(Math.max(18, Math.min(90, (W - L - 20) / nc, (H - T - 30) / nr))), x0 = L + Math.max(0, (W - L - 20 - c * nc) / 2), y0 = T;
        var g = svg.append("g"), sel = S.sel, col = d3.scaleQuantize().domain([0, 1]).range(RAMP);
        M.rows.forEach(function (f, i) {
            M.cols.forEach(function (t, j) {
                if (f === NEW && t === GONE) return;
                var cell = M.cells[f + "\u0001" + t], n = cell ? cell.items.length : 0, share = M.rowTot[f] ? n / M.rowTot[f] : 0, diag = f === t, isSel = sel && sel.f === f && sel.t === t;
                var e = g.append("g").attr("class", "cell").attr("transform", "translate(" + (x0 + j * c) + "," + (y0 + i * c) + ")").attr("opacity", sel && !isSel ? 0.45 : 1)
                    .on("mousemove", function (ev) { tipCell(f, t, n, share, ev); }).on("mouseleave", tip).on("click", function (ev) { ev.stopPropagation(); if (n) select(f, t); });
                var fill = n ? col(share) : "#fcfcfb";
                e.append("rect").attr("x", 1).attr("y", 1).attr("width", c - 2).attr("height", c - 2).attr("rx", 3).attr("fill", fill).attr("stroke", isSel ? SELECT : diag ? "#3a3936" : "#ebeae5").attr("stroke-width", isSel ? 3 : diag ? 1.6 : 1);
                if (n && c > 30) { var ink = d3.lab(fill).l > 60 ? "#0b0b0b" : "#ffffff"; e.append("text").attr("x", c / 2).attr("y", c / 2 - (c > 44 ? 5 : 0)).attr("dy", "0.35em").attr("text-anchor", "middle").style("font-size", c > 60 ? "13px" : "11px").style("font-weight", "bold").attr("fill", ink).attr("pointer-events", "none").text(pct(share)); if (c > 44) e.append("text").attr("x", c / 2).attr("y", c / 2 + 12).attr("dy", "0.35em").attr("text-anchor", "middle").style("font-size", "10px").attr("fill", ink).attr("opacity", 0.8).attr("pointer-events", "none").text(n.toLocaleString()); }
            });
            g.append("text").attr("x", x0 - 8).attr("y", y0 + i * c + c / 2).attr("dy", "0.35em").attr("text-anchor", "end").style("font-size", "11.5px").attr("fill", f === NEW ? "#898781" : "#2b2a28").text(f + " (" + (M.rowTot[f] || 0).toLocaleString() + ")");
        });
        M.cols.forEach(function (t, j) { g.append("text").attr("x", x0 + j * c + c / 2).attr("y", y0 - 8).attr("text-anchor", "middle").style("font-size", "11.5px").attr("fill", t === GONE ? "#898781" : "#2b2a28").text(t.length * 6.5 > c ? t.slice(0, Math.max(3, Math.floor(c / 6.5))) : t); });
        g.append("text").attr("x", x0 + nc * c / 2).attr("y", y0 - 26).attr("text-anchor", "middle").style("font-size", "11px").attr("fill", "#52514e").text("State in " + M.B + " \u2192");
        g.append("text").attr("x", 10).attr("y", y0 - 26).style("font-size", "11px").attr("fill", "#52514e").text("In " + M.A + " \u2193");
        var head = svg.append("text").attr("x", 10).attr("y", 18).style("font-size", "12.5px");
        head.append("tspan").style("font-weight", "bold").text(M.F.s + " from " + M.A + " to " + M.B + ": " + pct(M.both ? M.stay / M.both : 0) + " stayed");
        if (M.ordered) { head.append("tspan").attr("fill", UP).style("font-weight", "bold").text(", \u25b2 " + pct(M.both ? M.up / M.both : 0) + " moved up"); head.append("tspan").attr("fill", DOWN).style("font-weight", "bold").text(", \u25bc " + pct(M.both ? M.down / M.both : 0) + " moved down"); }
        head.append("tspan").attr("fill", "#52514e").text("  (each row adds up to 100%)");
        if (intro) { var cs = svg.selectAll("g.cell"); fadeIn(cs, 380, stag(cs.size(), 700)); }
        side();
    }
    function side() {
        var M = S.model, el = document.getElementById("side");
        var h = '<h3>' + esc(M.A) + ' to ' + esc(M.B) + '</h3><div class="stat"><b>' + M.both.toLocaleString() + '</b> ' + esc(M.F.i.toLowerCase()) + 's in both periods</div><div class="stat"><b>' + pct(M.both ? M.stay / M.both : 0) + '</b> stayed in the same ' + esc(M.F.s.toLowerCase()) + '</div>';
        if (M.ordered) h += '<div class="stat" style="color:' + UP + '"><b style="color:' + UP + '">\u25b2 ' + pct(M.both ? M.up / M.both : 0) + '</b> moved up (' + M.up.toLocaleString() + ')</div><div class="stat" style="color:' + DOWN + '"><b style="color:' + DOWN + '">\u25bc ' + pct(M.both ? M.down / M.both : 0) + '</b> moved down (' + M.down.toLocaleString() + ')</div>';
        else h += '<div class="stat"><b>' + pct(M.both ? (M.up + M.down) / M.both : 0) + '</b> changed</div>';
        h += '<h3>In and out</h3><div class="stat"><b>' + M.fresh.toLocaleString() + '</b> new in ' + esc(M.B) + '</div><div class="stat"><b>' + M.gone.toLocaleString() + '</b> in ' + esc(M.A) + ' but not in ' + esc(M.B) + '</div>';
        h += '<div class="note">Rows are the state in ' + esc(M.A) + ', columns the state in ' + esc(M.B) + '; each cell is the share of its row. The outlined diagonal is no change.' + (M.ordered ? ' Up means a move towards the first state in Order.' : ' Type the states in Order, best first, to see moves up and down.') + ' Click a cell to select those ' + esc(M.F.i.toLowerCase()) + 's (up to 3,000).</div>';
        el.innerHTML = h;
    }
    function tipCell(f, t, n, share, ev) {
        var M = S.model, txt = f === NEW ? 'New in ' + esc(M.B) + ', in ' + esc(t) : t === GONE ? 'In ' + esc(f) + ' in ' + esc(M.A) + ', not in ' + esc(M.B) : f === t ? 'Stayed in ' + esc(f) : esc(f) + ' \u2192 ' + esc(t);
        show('<b>' + txt + '</b><br><span class="k">' + esc(M.F.i) + 's:</span> ' + n.toLocaleString() + '<br><span class="k">Share of the row:</span> ' + pct(share), ev);
    }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    function select(f, t) {
        if (S.sel && S.sel.f === f && S.sel.t === t) return publish(null, null);
        var M = S.model, items = M.cells[f + "\u0001" + t].items;
        if (items.length > 3000) { omniscope.view.error(items.length.toLocaleString() + " items; selection is limited to 3,000."); return; }
        var eq = function (k) { return { type: "FIELD_VALUE", inputField: M.F.i, operator: "=", value: M.raws.get(k) }; };
        publish(items.length === 1 ? eq(items[0]) : { type: "OR", filters: items.map(eq) }, { f: f, t: t });
    }
    window.__trans.select = select;

    document.getElementById("chart").addEventListener("click", function () { if (S.sel) publish(null, null); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
</body>
