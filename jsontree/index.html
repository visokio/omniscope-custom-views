<!doctype html>
<html>
<head>
  <meta charset="utf-8" />

  <!-- jsTree (MIT) and jQuery (MIT), pinned versions from the jsDelivr CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jstree@3.3.17/dist/themes/default/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jstree@3.3.17/dist/jstree.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      color: #333;
    }
    #main {
      position: absolute;
      inset: 0;
      overflow: auto;
      padding: 4px 6px;
      box-sizing: border-box;
    }
    #note { color: #8a5a00; font-size: 11px; padding: 2px 4px 4px; }
    #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
               text-align: center; padding: 12px; color: #666; font-size: 13px; }
    .jstree-default .jstree-anchor { font-size: 13px; }
    .k { color: #1d5fa6; }
    .s { color: #a3410f; }
    .n { color: #157a52; }
    .b { color: #6a3fb0; }
    .z { color: #888; font-style: italic; }
    .c { color: #888; }
    .bad { color: #b3261e; }
  </style>
</head>

<body>
  <div id="main"><div id="note"></div><div id="tree"></div></div>
  <div id="message"></div>

  <!-- Omniscope custom view API -->
  <script src="/_global_/customview/v1/omniscope.js"></script>

  <script>
    // Shows a text field holding JSON as an expandable tree: one top-level node per record (the first one opened).
    var MAX_RECORDS = 500;     // more records than this are left out, with a note
    var MAX_TEXT = 200;        // longer string values are cut in the label (the full value is in the tooltip)
    var state = { records: 0, shown: 0, selected: null };
    window.__jsontree = state;

    if (!omniscope || !omniscope.view) throw new Error("Omniscope chart API is not loaded");

    omniscope.view.on("load", function () {
      window.onerror = function (msg) {
        omniscope.view.error(msg);
      };
    });

    // A click on empty space clears the selection in Omniscope and closes menus; clicks in the tree do not
    document.body.addEventListener("click", function (e) {
      if ($(e.target).closest(".jstree-node").length) return;
      if (state.selected !== null) { state.selected = null; try { $("#tree").jstree("deselect_all", true); } catch (err) {} }
      omniscope.view.whitespaceClick();
    });

    function message(text) {
      var m = document.getElementById("message");
      m.style.display = text ? "flex" : "none";
      m.textContent = text || "";
      document.getElementById("main").style.display = text ? "none" : "block";
    }

    // The view queries its own data (autoQuery is off), so it applies the report's filter itself
    omniscope.view.on(["load", "update"], function () {
      var ctx = omniscope.view.context(), it = ctx.options.items || {};
      if (!ctx.viewSelection) state.selected = null;
      if (!it.json) {
        destroy();
        message("Choose a JSON field: a text field whose values are JSON.");
        return;
      }
      var fields = [it.json];
      if (it.label) fields.push(it.label);
      omniscope.view.busy(true);
      omniscope.query.builder(omniscope.view.endpoint()).table({
        fields: fields,
        filter: ctx.dataConfig.filter,
        range: { start: 0, length: MAX_RECORDS + 1 }
      }).on("load", function (event) {
        omniscope.view.busy(false);
        renderTree(event.data.records || [], it.label || null);
      }).on("error", function (event) {
        omniscope.view.busy(false);
        var e = event && event.data ? event.data : {};
        message("Query failed: " + (e.message || "unknown error"));
      }).execute();
    });

    function destroy() {
      try { $("#tree").jstree("destroy"); } catch (e) {}
      $("#tree").empty();
    }

    function renderTree(records, labelField) {
      destroy();
      if (!records.length) { message("No data to show. Check the report's filters."); return; }
      message(null);
      state.records = records.length;
      var rows = records.slice(0, MAX_RECORDS);
      state.shown = rows.length;
      document.getElementById("note").textContent = records.length > MAX_RECORDS
        ? "Showing the first " + MAX_RECORDS + " records. Filter the report to see others." : "";
      document.getElementById("note").style.display = records.length > MAX_RECORDS ? "block" : "none";

      // A single record opens at its content; several records each get a top-level node
      var single = rows.length === 1;
      var nodes = rows.map(function (r, i) {
        var title = labelField ? (r[1] === null || r[1] === undefined ? "(blank)" : String(r[1])) : "Record " + (i + 1);
        var node;
        if (r[0] === null || r[0] === undefined || r[0] === "") {
          node = { text: esc(title) + " <span class='z'>(empty)</span>", icon: "jstree-file" };
        } else {
          try {
            node = toNode(JSON.parse(r[0]), title, true);
          } catch (err) {
            node = { text: esc(title) + " <span class='bad'>invalid JSON: " + esc(err.message) + "</span>",
                     icon: "jstree-file", a_attr: { title: String(r[0]).slice(0, 1000) } };
          }
        }
        node.data = { label: labelField ? r[1] : undefined, record: true };
        node.state = { opened: i === 0 };
        return node;
      });

      $("#tree").jstree({
        core: {
          data: nodes,
          multiple: false,
          themes: { name: "default", stripes: false, dots: false, icons: true }
        }
      }).on("activate_node.jstree", function (e, d) {
        // A click on a record's top-level node selects the records with its label (when Record label is set);
        // a second click clears. Other nodes only open and close.
        var tree = $("#tree").jstree(true), node = d.node;
        tree.deselect_all(true);
        if (!labelField || !node.data || !node.data.record) { tree.toggle_node(node); return; }
        var key = JSON.stringify(node.data.label);
        if (state.selected === key) {
          state.selected = null;
          omniscope.view.context().viewSelection = null;
        } else {
          state.selected = key;
          tree.select_node(node, true);
          omniscope.view.context().viewSelection = { filter: { type: "AND", filters: [
            { type: "FIELD_VALUE", inputField: labelField, operator: "=", value: node.data.label } ] } };
        }
        omniscope.view.updated();
      }).on("ready.jstree", function () {
        if (single) return;
        var tree = $("#tree").jstree(true);
        if (state.selected !== null) {
          tree.get_node("#").children.forEach(function (id) {
            var n = tree.get_node(id);
            if (n.data && JSON.stringify(n.data.label) === state.selected) tree.select_node(id, true);
          });
        }
      });
    }

    // HTML-escape: jsTree shows node text as HTML, and the values come from the data
    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // One jsTree node per JSON value: objects and arrays have children and show their size
    function toNode(value, key, isRoot) {
      var keyHtml = isRoot ? "<b>" + esc(key) + "</b>" : "<span class='k'>" + esc(key) + "</span>";
      if (Array.isArray(value)) {
        return { text: keyHtml + " <span class='c'>[" + value.length + "]</span>",
                 children: value.map(function (v, i) { return toNode(v, String(i), false); }) };
      }
      if (value !== null && typeof value === "object") {
        var keys = Object.keys(value);
        return { text: keyHtml + " <span class='c'>{" + keys.length + "}</span>",
                 children: keys.map(function (k) { return toNode(value[k], k, false); }) };
      }
      var html, title = null;
      if (value === null) html = "<span class='z'>null</span>";
      else if (typeof value === "string") {
        var shown = value.length > MAX_TEXT ? value.slice(0, MAX_TEXT) + "..." : value;
        if (value.length > MAX_TEXT) title = value.slice(0, 2000);
        html = "<span class='s'>\"" + esc(shown) + "\"</span>";
      }
      else if (typeof value === "number") html = "<span class='n'>" + esc(value) + "</span>";
      else html = "<span class='b'>" + esc(value) + "</span>";
      var node = { text: keyHtml + ": " + html, icon: "jstree-file" };
      if (title) node.a_attr = { title: title };
      return node;
    }
  </script>
</body>
</html>
