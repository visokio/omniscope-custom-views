<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>

        .axis text { fill: #898781; font-size: 10px; } .axis path, .axis line { stroke: #c3c2b7; } .grid line { stroke: #eeede8; } .grid path { display: none; }

        td { padding: 4px 6px; border-bottom: 1px solid #eeede8; text-align: right; white-space: nowrap; }
        td.l { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
        tr.r { cursor: pointer; } tr.r:hover td { background: #f3f6fb; } tr.r.sel td { background: #eaf1fc; }
        .pos { color: #256abf; } .neg { color: #d03b3b; }
        .tag { font-size: 10px; color: #fff; border-radius: 3px; padding: 0 4px; margin-left: 4px; }
        #tooltip { position: absolute; display: none; pointer-events: none; background: rgba(252,252,251,.97); border: 1px solid rgba(11,11,11,.1); box-shadow: 0 4px 14px rgba(0,0,0,.15); border-radius: 6px; padding: 6px 9px; line-height: 1.45; max-width: 300px; z-index: 5; }
        #tooltip .k { color: #52514e; }
        #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #52514e; font-size: 14px; padding: 20px; background: #fcfcfb; z-index: 6; }
    </style>

    <!-- Put SCRIPT tags to load 3rd party libraries here -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>

<body>
<div id="main"><!-- This element is where the view will render -->
    <div id="left"><svg id="svg"></svg><div id="head"></div></div>
    <div id="right"><div id="table"></div></div>
</div>
<div id="tooltip"></div>
<div id="message"></div>

<script src="/_global_/customview/v1/omniscope.js"></script><!-- Add the Omniscope custom view API -->

        ["Volume", "Mix", "Price", "New products", "Discontinued"].forEach(function (k) { if (k === "New products" && !M.news.length) return; if (k === "Discontinued" && !M.lost.length) return; steps.push({ k: k, label: k, v: M.eff[k], from: acc, to: acc + M.eff[k] }); acc += M.eff[k]; });
        steps.push({ k: "current", label: M.cur, v: M.R1, total: true });
        var lo = d3.min(steps, function (s) { return s.total ? s.v : Math.min(s.from, s.to); }), hi = d3.max(steps, function (s) { return s.total ? s.v : Math.max(s.from, s.to); });
        var floor = Math.max(0, lo - (hi - lo) * 0.6);
        var x = d3.scaleBand().domain(steps.map(function (s) { return s.k; })).range([m.l, W - m.r]).padding(0.28), y = d3.scaleLinear().domain([floor, hi + (hi - floor) * 0.08]).nice().range([H - m.b, m.t]);

        svg.append("g").attr("class", "axis").attr("transform", "translate(" + m.l + ",0)").call(d3.axisLeft(y).ticks(5).tickFormat(function (v) { return fmt(v); }));

                .on("mousemove", function (ev) { tip(s, ev); }).on("mouseleave", function () { tip(null); })

            if (S.sel && S.sel.effect === s.k) svg.append("rect").attr("x", x(s.k) - 3).attr("y", top - 3).attr("width", x.bandwidth() + 6).attr("height", h + 6).attr("rx", 4).attr("fill", "none").attr("stroke", SELECT).attr("stroke-dasharray", "4,2");
            if (i < steps.length - 1) { var ny = s.total ? y(s.v) : y(s.to); svg.append("line").attr("x1", x(s.k) + x.bandwidth()).attr("x2", x(steps[i + 1].k)).attr("y1", ny).attr("y2", ny).attr("stroke", "#898781").attr("stroke-dasharray", "2,2"); }
            svg.append("text").attr("x", x(s.k) + x.bandwidth() / 2).attr("y", top - 5).attr("text-anchor", "middle").attr("font-size", 11).attr("font-weight", "bold").attr("fill", s.total ? "#0b0b0b" : s.v >= 0 ? "#256abf" : "#b02c2c").text(s.total ? fmt(s.v) : sgn(s.v));
            var lab = svg.append("text").attr("x", x(s.k) + x.bandwidth() / 2).attr("y", H - m.b + 16).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", "#52514e").text(s.label);
