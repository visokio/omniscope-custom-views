    function tipBar(G, j, ev) { var M = S.model; show('<b>' + esc(M.steps[j]) + '</b>' + (G.name !== "All" ? ' <span class="k">(' + esc(G.name) + ')</span>' : '') + '<br><span class="k">Users:</span> ' + G.reach[j].toLocaleString() + ' (' + pct(G.reach[j] / G.reach[0]) + ' of the start)' + (j ? '<br><span class="k">From previous step:</span> ' + pct(G.conv[j]) + '<br><span class="k">Median time from previous:</span> ' + dur(G.med[j]) : ''), ev); }
    function tipDrop(G, j, ev) { var M = S.model, lost = G.reach[j - 1] - G.reach[j]; show('<b>Dropped after ' + esc(M.steps[j - 1]) + '</b>' + (G.name !== "All" ? ' <span class="k">(' + esc(G.name) + ')</span>' : '') + '<br><span class="k">Users:</span> ' + lost.toLocaleString() + ' (' + pct(lost / G.reach[j - 1]) + ' of those who got there)', ev); }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    // reached step j: users whose last step is j or later; dropped before step j: users whose last step is j-1
    function selectUsers(G, j, dropped) {
        var M = S.model, meta = dropped ? { drop: j } : { step: j }; if (G.name !== "All") meta.group = G.name;
        if (S.sel && JSON.stringify(S.sel) === JSON.stringify(meta)) return publish(null, null);
        var raws = dropped ? G.lists[j - 1].slice() : [].concat.apply([], G.lists.slice(j));
        if (!raws.length) return;
        if (raws.length > 3000) { omniscope.view.error(raws.length.toLocaleString() + " users; selection is limited to 3,000. Filter first, for example by channel or date."); return; }
        var eq = function (v) { return { type: "FIELD_VALUE", inputField: M.F.u, operator: "=", value: v }; };
        publish(raws.length === 1 ? eq(raws[0]) : { type: "OR", filters: raws.map(eq) }, meta);
    }
    window.__fun.select = function (j, dropped, group) { var M = S.model, G = group ? M.groups.find(function (x) { return x.name === group; }) : M.all; selectUsers(G, j, dropped); };

    document.getElementById("chart").addEventListener("click", function () { if (S.sel) publish(null, null); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
