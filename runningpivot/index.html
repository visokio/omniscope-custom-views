<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Running Pivot</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      color: #333;
    }
    /* The table keeps its natural size and the container scrolls in both directions */
    #pivot { position: absolute; inset: 0; overflow: auto; padding: 6px; box-sizing: border-box; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #e1e0d9; padding: 4px 9px; white-space: nowrap; }
    th { background: #f6f6f3; font-weight: 600; text-align: center; color: #444; }
    th.corner { text-align: left; color: #666; font-weight: normal; }
    th.rowfield { text-align: left; }
    td { text-align: right; font-variant-numeric: tabular-nums; cursor: pointer; }
    td.dim { text-align: left; background: #fbfbf9; font-weight: 600; }
    th.col { cursor: pointer; }
    td:hover, th.col:hover { background: #eef4fb; }
    .sel { background: #d7e6f7 !important; }
    tr.last td { border-bottom: 2px solid #c9c8c1; font-weight: 600; }
    #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
               text-align: center; padding: 12px; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div id="pivot"></div>
  <div id="message"></div>

  <script src="/_global_/customview/v1/omniscope.js"></script>
  <script>
(function() {
  // A pivot table of running totals: the measure for each combination of Rows and Columns, added up down each
  // column in row order, so each cell holds the total so far. The last row holds each column's total.
  var MAX_ROWS = 2000, MAX_COLS = 200;
  var state = { model: null, selected: null };
  window.__pivot = state;

  if (!omniscope || !omniscope.view) throw new Error("Omniscope chart API is not loaded");
  omniscope.view.on("load", function() {
    window.onerror = function(msg) { omniscope.view.error(msg); };
  });

  // A click on empty space clears the selection in Omniscope and closes menus
  document.body.addEventListener("click", function() {
    if (state.selected) { state.selected = null; paintSelection(); }
    omniscope.view.whitespaceClick();
  });

  // The view queries its own data (autoQuery is off), so it applies the report's filter itself. A resize needs no
  // redraw: the table scrolls.
  omniscope.view.on(["load", "update"], query);

  function message(text) {
    var m = document.getElementById("message");
    m.style.display = text ? "flex" : "none";
    m.textContent = text || "";
    if (text) { document.getElementById("pivot").innerHTML = ""; state.model = null; }
  }

  function query() {
    var ctx = omniscope.view.context(), it = ctx.options.items || {};
    var rows = Array.isArray(it.paneY) ? it.paneY : (it.paneY ? [it.paneY] : []);
    var cols = Array.isArray(it.paneX) ? it.paneX : (it.paneX ? [it.paneX] : []);
    if (!it.measures) { message("Choose a Measure, for example the sum of Sales."); return; }
    if (!rows.length) { message("Choose one or more Rows, for example a month: the running total adds up down the rows."); return; }
    if (!ctx.viewSelection) state.selected = null;

    omniscope.view.busy(true);
    omniscope.query.builder(omniscope.view.endpoint()).table({
      groupings: rows.concat(cols),
      measures: [it.measures],
      filter: ctx.dataConfig.filter,
      range: { start: 0, length: MAX_ROWS * 20 + 1 }
    }).on("load", function(event) {
      omniscope.view.busy(false);
      render(event.data.records || [], rows, cols, it.measures);
    }).on("error", function(event) {
      omniscope.view.busy(false);
      message("Query failed: " + (event.data && event.data.message ? event.data.message : "unknown error"));
    }).execute();
  }

  function render(records, rowOpts, colOpts, measure) {
    if (!records.length) { message("No data to show. Check the report's filters."); return; }
    var M = rowOpts.length, N = colOpts.length;

    // Distinct row and column combinations, in sorted order
    var rowKeys = {}, colKeys = {}, rowList = [], colList = [], cells = {};
    records.forEach(function(r) {
      var rv = r.slice(0, M), cv = r.slice(M, M + N), rk = JSON.stringify(rv), ck = JSON.stringify(cv);
      if (!(rk in rowKeys)) { rowKeys[rk] = rv; rowList.push(rk); }
      if (!(ck in colKeys)) { colKeys[ck] = cv; colList.push(ck); }
      var v = r[M + N];
      cells[rk + "|" + ck] = typeof v === "number" && isFinite(v) ? v : 0;
    });
    if (rowList.length > MAX_ROWS) { message(rowList.length + " rows is too many to show: choose Rows with fewer values, or filter the report."); return; }
    if (colList.length > MAX_COLS) { message(colList.length + " columns is too many to show: choose Columns with fewer values, or filter the report."); return; }
    message(null);
    rowList.sort(function(a, b) { return compareArrays(rowKeys[a], rowKeys[b]); });
    colList.sort(function(a, b) { return compareArrays(colKeys[a], colKeys[b]); });

    // Running totals down each column
    var running = {};
    colList.forEach(function(ck) {
      var sum = 0;
      rowList.forEach(function(rk) {
        sum += cells[rk + "|" + ck] || 0;
        running[rk + "|" + ck] = sum;
      });
    });
    state.model = { rowOpts: rowOpts, colOpts: colOpts, rowKeys: rowKeys, colKeys: colKeys, rowList: rowList, colList: colList, running: running };

    // Header: one row per Columns level (a single "Running total" row without Columns), then the Rows field names
    var h = [], title = "Running total of " + measureName(measure);
    h.push("<table><thead>");
    if (N === 0) {
      h.push("<tr><th class='corner' colspan='" + M + "'></th><th class='col' data-col='0'>" + esc(title) + "</th></tr>");
    } else {
      h.push("<tr><th class='corner' colspan='" + M + "'>" + esc(title) + "</th><th colspan='" + colList.length + "'>" +
        esc(colOpts.map(fieldName).join(" / ")) + "</th></tr>");
      for (var level = 0; level < N; level++) {
        h.push("<tr><th class='corner' colspan='" + M + "'></th>");
        var i = 0;
        while (i < colList.length) {
          // Merge neighbouring columns that share this level and every level above it
          var j = i + 1;
          while (j < colList.length && samePrefix(colKeys[colList[i]], colKeys[colList[j]], level + 1)) j++;
          var leaf = level === N - 1;
          h.push("<th" + (leaf ? " class='col' data-col='" + i + "'" : "") + " colspan='" + (j - i) + "'>" +
            esc(label(colKeys[colList[i]][level])) + "</th>");
          i = j;
        }
        h.push("</tr>");
      }
    }
    h.push("<tr>" + rowOpts.map(function(o) { return "<th class='rowfield'>" + esc(fieldName(o)) + "</th>"; }).join("") +
      "<th colspan='" + colList.length + "'></th></tr></thead><tbody>");

    // Body: the row values, then the running totals
    rowList.forEach(function(rk, ri) {
      h.push("<tr" + (ri === rowList.length - 1 ? " class='last'" : "") + ">");
      rowKeys[rk].forEach(function(v) { h.push("<td class='dim' data-row='" + ri + "'>" + esc(label(v)) + "</td>"); });
      colList.forEach(function(ck, ci) {
        h.push("<td data-row='" + ri + "' data-col='" + ci + "'>" + esc(format(running[rk + "|" + ck])) + "</td>");
      });
      h.push("</tr>");
    });
    h.push("</tbody></table>");
    var pivot = document.getElementById("pivot");
    pivot.innerHTML = h.join("");

    // Click a row's name to select the row, a column heading to select the column, a value for both
    Array.prototype.forEach.call(pivot.querySelectorAll("[data-row], th[data-col]"), function(el) {
      el.addEventListener("click", function(e) {
        e.stopPropagation();
        var r = el.hasAttribute("data-row") ? +el.getAttribute("data-row") : null;
        var c = el.hasAttribute("data-col") && N > 0 ? +el.getAttribute("data-col") : null;
        if (r === null && c === null) return;
        var key = r + "," + c;
        select(state.selected === key ? null : key, r, c);
      });
    });
    paintSelection();
  }

  function select(key, r, c) {
    var m = state.model, ctx = omniscope.view.context();
    state.selected = key;
    if (key === null) {
      ctx.viewSelection = null;
    } else {
      var filters = [];
      if (r !== null) m.rowOpts.forEach(function(o, i) { filters.push(valueFilter(o.inputField, m.rowKeys[m.rowList[r]][i])); });
      if (c !== null) m.colOpts.forEach(function(o, i) { filters.push(valueFilter(o.inputField, m.colKeys[m.colList[c]][i])); });
      ctx.viewSelection = { filter: { type: "AND", filters: filters } };
    }
    omniscope.view.updated();
    paintSelection();
  }

  function paintSelection() {
    var sel = state.selected ? state.selected.split(",") : null;
    Array.prototype.forEach.call(document.querySelectorAll("#pivot td, #pivot th.col"), function(el) {
      var on = false;
      if (sel) {
        var r = el.getAttribute("data-row"), c = el.getAttribute("data-col");
        var rowOk = sel[0] === "null" || r === sel[0], colOk = sel[1] === "null" || c === sel[1];
        if (el.tagName === "TH") on = sel[0] === "null" && c === sel[1];
        else if (el.classList.contains("dim")) on = sel[1] === "null" && r === sel[0];
        else on = rowOk && colOk;
      }
      el.classList.toggle("sel", on);
    });
  }

  // The filter that selects one grouping value: a range for a histogram grouping, otherwise an equality
  function valueFilter(field, v) {
    if (isRange(v)) {
      return { type: "AND", filters: [
        { type: "FIELD_VALUE", inputField: field, operator: ">=", value: v.lower },
        { type: "FIELD_VALUE", inputField: field, operator: "<", value: v.upper } ] };
    }
    return { type: "FIELD_VALUE", inputField: field, operator: "=", value: v === undefined ? null : v };
  }

  function fieldName(o) { return o.displayName || o.inputField; }
  function measureName(m) {
    if (m.displayName) return m.displayName;
    if (!m.function || m.function === "RECORD_COUNT") return "Record count";
    return m.inputField + " (" + m.function.toLowerCase().replace(/_/g, " ") + ")";
  }
  function format(v) {
    var a = Math.abs(v);
    if (a >= 100 || v === Math.round(v)) return Math.round(v).toLocaleString();
    return (+v.toFixed(2)).toLocaleString();
  }

  // Labels: date ranges from a histogram grouping read as a year, quarter, month, week or day
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function isRange(v) { return v !== null && typeof v === "object" && ("lower" in v || "upper" in v); }
  function ymd(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})(T00:00(:00)?(\.0+)?Z?)?$/.exec(String(s));
    return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
  }
  function label(v) {
    if (v === null || v === undefined) return "(blank)";
    if (isRange(v)) {
      var a = ymd(v.lower), b = ymd(v.upper);
      if (a && b) {
        var months = (b.y - a.y) * 12 + (b.m - a.m);
        var days = Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 86400000);
        var date = a.y + "-" + ("0" + a.m).slice(-2) + "-" + ("0" + a.d).slice(-2);
        if (a.d === 1 && b.d === 1 && months === 12 && a.m === 1) return String(a.y);
        if (a.d === 1 && b.d === 1 && months === 3 && (a.m - 1) % 3 === 0) return "Q" + ((a.m + 2) / 3) + " " + a.y;
        if (a.d === 1 && b.d === 1 && months === 1) return MONTHS[a.m - 1] + " " + a.y;
        if (days === 1) return date;
        if (days === 7) return "Week of " + date;
      }
      return label(v.lower) + " to " + label(v.upper);
    }
    if (typeof v === "number") return (+v.toPrecision(10)).toLocaleString();
    var d = ymd(v);
    if (d) return d.y + "-" + ("0" + d.m).slice(-2) + "-" + ("0" + d.d).slice(-2);
    return String(v);
  }

  // Sorting: numbers numerically, ranges by their lower bound, other values as text; blanks last
  function compareValues(a, b) {
    if (isRange(a)) a = a.lower;
    if (isRange(b)) b = b.lower;
    if (a === b) return 0;
    if (a === null || a === undefined) return 1;
    if (b === null || b === undefined) return -1;
    if (typeof a === "number" && typeof b === "number") return a - b;
    if (typeof a === "number") return -1;
    if (typeof b === "number") return 1;
    return String(a).localeCompare(String(b), undefined, { numeric: true });
  }
  function compareArrays(a, b) {
    for (var i = 0; i < Math.min(a.length, b.length); i++) {
      var c = compareValues(a[i], b[i]);
      if (c !== 0) return c;
    }
    return a.length - b.length;
  }
  function samePrefix(a, b, n) {
    for (var i = 0; i < n; i++) if (JSON.stringify(a[i]) !== JSON.stringify(b[i])) return false;
    return true;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
})();
  </script>
</body>
</html>
