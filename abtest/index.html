                '<td class="wide">' + (c ? pfmt(c.p) : '') + '</td><td class="wide">' + (c && c.beat !== null ? chance(M.higherGood ? c.beat : 1 - c.beat) : '') + '</td><td class="l">' + tag + '</td></tr>';
        });
        h += '</table>';
        // segments forest plot
        if (M.segs && M.segs.length) {
            var rowsPer = T.length, rh2 = 15, gap = 10, FW = Math.max(200, Math.min(560, window.innerWidth - 220)), LW = 150;
            var all = []; M.segs.forEach(function (sg) { T.forEach(function (v) { var c = sg.cmp[v.name]; if (c && isFinite(c.rlo) && isFinite(c.rhi)) all.push(c.rlo, c.rhi); }); });
            var e2 = Math.min(1.5, Math.max(0.02, d3.max(all.map(Math.abs)) || 0.1) * 1.05), fs = d3.scaleLinear().domain([-e2, e2]).range([LW + 8, LW + FW]);
            var H2 = M.segs.length * (rowsPer * rh2 + gap) + 26, sv = '<svg width="' + (LW + FW + 70) + '" height="' + H2 + '">';
            sv += '<line x1="' + fs(0) + '" x2="' + fs(0) + '" y1="0" y2="' + (H2 - 18) + '" stroke="#9a988f" stroke-dasharray="2 2"/>';
            fs.ticks(5).forEach(function (t) { sv += '<text x="' + fs(t) + '" y="' + (H2 - 4) + '" text-anchor="middle" font-size="10.5" fill="#52514e">' + spct(t) + '</text>'; });
            var y = 4;
            M.segs.forEach(function (sg) {
                var hh = rowsPer * rh2, isSel = S.sel && S.sel.segment === sg.name;
                sv += '<g class="seg" data-s="' + esc(sg.name) + '"><rect class="bg" x="0" y="' + (y - 3) + '" width="' + (LW + FW + 70) + '" height="' + (hh + 6) + '" fill="' + (isSel ? 'rgba(33,97,217,.08)' : 'transparent') + '"/>';
                sv += '<text x="0" y="' + (y + hh / 2) + '" dy="0.35em" font-size="11.5" fill="#2b2a28"' + (isSel ? ' font-weight="bold"' : '') + '>' + esc(sg.name.length > 22 ? sg.name.slice(0, 21) + "\u2026" : sg.name) + ' <tspan fill="#898781" font-size="10.5">' + sg.n.toLocaleString() + '</tspan></text>';
                T.forEach(function (v, j) {
                    var c = sg.cmp[v.name], yy = y + j * rh2 + rh2 / 2; if (!c || ![c.rlo, c.rhi, c.rel].every(isFinite)) return;
                    var X = function (q) { return Math.max(LW + 8, Math.min(LW + FW, fs(q))); };
                    sv += '<line x1="' + X(c.rlo) + '" x2="' + X(c.rhi) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + v.colour + '" stroke-width="2.5" opacity=".55"/><rect x="' + (X(c.rel) - 4) + '" y="' + (yy - 4) + '" width="8" height="8" fill="' + v.colour + '"/>';
                    sv += '<text x="' + (LW + FW + 8) + '" y="' + yy + '" dy="0.35em" font-size="10.5" fill="#52514e">' + spct(c.rel) + '</text>';
                });
                sv += '</g>'; y += hh + gap;
            });
            sv += '</svg>';
            h += '<h3>Uplift against ' + esc(C.name) + ' by ' + esc(M.F.g) + '</h3>' + (T.length > 1 ? '<div style="margin-bottom:4px">' + T.map(function (v) { return '<span style="margin-right:12px"><span class="sw" style="background:' + v.colour + '"></span>' + esc(v.name) + '</span>'; }).join("") + '</div>' : '') + sv;
            h += '<div class="note">Each line is the ' + Math.round(M.conf * 100) + '% interval of the uplift in that group; groups are smaller than the whole test, so their intervals are wider. Look for groups whose interval sits clearly away from zero, and treat differences between groups as ideas to test, not results.</div>';
        }
        var mde = T.map(function (v) { return v.cmp.mde; }).filter(isFinite);
        h += '<div class="note">' + (M.binary ? 'Outcome treated as a conversion (1 or 0): rates compared with a two-proportion z-test.' : 'Outcome treated as a value: averages compared with a z-test on the means (Welch standard errors).') + (mde.length ? ' With this many records the test can reliably detect (80% power) a change of about ' + pctv(d3.max(mde), 1) + ' or more.' : '') + ' Intervals for the uplift are approximate. Click a variant or a group to select its records.</div>';
        el.innerHTML = h;
        if (intro) { fadeCss(d3.selectAll("#verdict, #main h3, #main tr, #main .note"), 450, 70); popIn(d3.selectAll("#main svg circle"), 500, 60); }
        Array.prototype.forEach.call(el.querySelectorAll("tr.v"), function (r) {
            var v = M.vs.find(function (x) { return x.name === r.getAttribute("data-v"); });
            r.addEventListener("click", function (e) { e.stopPropagation(); selectVariant(v); });
            r.addEventListener("mousemove", function (e) { tipVariant(v, e); }); r.addEventListener("mouseleave", tip);
        });
        Array.prototype.forEach.call(el.querySelectorAll("g.seg"), function (g) {
            var sg = M.segs.find(function (x) { return x.name === g.getAttribute("data-s"); });
            g.addEventListener("click", function (e) { e.stopPropagation(); selectSegment(sg); });
            g.addEventListener("mousemove", function (e) { tipSeg(sg, e); }); g.addEventListener("mouseleave", tip);
        });
    }

    function tipVariant(v, ev) {
        var M = S.model, c = v.cmp, xf = function (q) { return M.binary ? pctv(q, 2) : fmt(q); };
        var h = '<b>' + esc(v.name) + '</b><br><span class="k">' + (M.binary ? "Conversion rate" : "Average") + ':</span> ' + xf(v.x) + ' <span class="k">(' + Math.round(M.conf * 100) + '% interval ' + xf(v.ci[0]) + ' to ' + xf(v.ci[1]) + ')</span><br><span class="k">Records:</span> ' + v.n.toLocaleString();
        if (c) h += '<br><span class="k">Difference:</span> ' + (M.binary ? (c.d > 0 ? "+" : c.d < 0 ? "\u2212" : "") + (100 * Math.abs(c.d)).toFixed(2) + " percentage points" : (c.d > 0 ? "+" : "") + fmt(c.d)) + ' <span class="k">(' + spct(c.rel) + ' relative)</span><br><span class="k">p-value:</span> ' + pfmt(c.p) + '<br><span class="k">Chance it is better than control:</span> ' + chance(M.higherGood ? c.beat : 1 - c.beat);
        show(h, ev);
    }
    function tipSeg(sg, ev) {
        var M = S.model, h = '<b>' + esc(sg.name) + '</b> <span class="k">(' + sg.n.toLocaleString() + ')</span>';
        M.vs.forEach(function (v) { var st = sg.v[v.name]; if (!st) return; var c = sg.cmp[v.name]; h += '<br><span class="sw" style="background:' + v.colour + '"></span>' + esc(v.name) + ': ' + (M.binary ? pctv(st.x, 2) : fmt(st.x)) + (c ? ' <span class="k">(' + spct(c.rel) + ', p ' + pfmt(c.p) + ')</span>' : ' <span class="k">(control)</span>'); });
        show(h, ev);
    }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    function selectVariant(v) { if (S.sel && S.sel.variant === v.name) return publish(null, null); publish({ type: "FIELD_VALUE", inputField: S.model.F.v, operator: "=", value: v.raw }, { variant: v.name }); }
    function selectSegment(sg) { if (S.sel && S.sel.segment === sg.name) return publish(null, null); publish({ type: "FIELD_VALUE", inputField: S.model.F.g, operator: "=", value: sg.raw }, { segment: sg.name }); }
    window.__ab.selectVariant = function (n) { selectVariant(S.model.vs.find(function (v) { return v.name === n; })); };

    document.body.addEventListener("click", function () { if (S.sel) publish(null, null); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
</body>
</html>
