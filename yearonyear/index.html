        h += '<div class="note">' + (M.s === 1 ? 'Calendar years.' : 'Financial years starting in ' + MONTHS[M.s - 1] + '.') + ' Click a point to select that period, or a year in the legend to select the whole year.</div>';
        el.innerHTML = h;
    }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    function range(lo, hi) { var F = S.model.F.d, iso = function (t) { return new Date(t).toISOString().slice(0, 10); }; return { type: "AND", filters: [{ type: "FIELD_VALUE", inputField: F, operator: ">=", value: iso(lo) }, { type: "FIELD_VALUE", inputField: F, operator: "<", value: iso(hi) }] }; }
    function selectPeriod(S2, i) {
        if (S.sel && S.sel.fy === S2.fy && S.sel.idx === i) return publish(null, null);
        var raw = S2.raw[i]; if (!raw || typeof raw !== "object") return;
        publish(range(tval(raw.lower), tval(raw.upper)), { fy: S2.fy, idx: i });
    }
    function selectYear(S2) { if (S.sel && S.sel.fy === S2.fy && S.sel.idx === undefined) return publish(null, null); var M = S.model; publish(range(fyStart(S2.fy, M.s), fyStart(S2.fy + 1, M.s)), { fy: S2.fy }); }
    window.__yoy.selectPeriod = function (age, i) { var M = S.model; selectPeriod(M.series[M.series.length - 1 - age], i); };
    window.__yoy.selectYear = function (age) { var M = S.model; selectYear(M.series[M.series.length - 1 - age]); };

    document.getElementById("chart").addEventListener("click", function () { if (S.sel) publish(null, null); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
</script>
