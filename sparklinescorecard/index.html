<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>

        tr.r.sel td { background: #eaf1fc; }

        td.name { font-weight: bold; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

        td.spark { padding: 2px 6px; width: 1%; }
        .up { color: #006300; } .down { color: #d03b3b; } .flat { color: #898781; }
        .bar { display: inline-block; width: 70px; height: 7px; background: #eeede8; border-radius: 4px; position: relative; vertical-align: middle; margin-right: 6px; overflow: hidden; }
        .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
        .status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }
        .status svg { width: 14px; height: 14px; }
        #foot { color: #898781; font-size: 11px; padding: 6px 10px; }
        #tooltip { position: absolute; display: none; pointer-events: none; background: rgba(252,252,251,.97); border: 1px solid rgba(11,11,11,.1); box-shadow: 0 4px 14px rgba(0,0,0,.15); border-radius: 6px; padding: 6px 9px; line-height: 1.45; white-space: nowrap; z-index: 5; }
        #tooltip .k { color: #52514e; }
        #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #52514e; font-size: 14px; padding: 20px; background: #fcfcfb; z-index: 6; }
    </style>
</head>

<body>

<div id="tooltip"></div>
<div id="message"></div>
