        var M = S.model; show('<b>' + esc(R.q) + '</b>' + (R.g !== null ? ' <span class="k">(' + esc(R.g) + ')</span>' : '') + '<br><span class="k">' + esc(a) + ':</span> <b>' + pct(R.share[i]) + '</b> (' + (R.c[a] || 0).toLocaleString() + ' of ' + R.n.toLocaleString() + ')<br><span class="k">' + (M.sc.kind === "nps" ? "Promoters" : "Positive") + ':</span> ' + pct(R.pos) + ' <span class="k">' + (M.sc.kind === "nps" ? "Detractors" : "Negative") + ':</span> ' + pct(R.neg) + (R.mean !== undefined ? '<br><span class="k">Average:</span> ' + R.mean.toFixed(2) : '') + (R.ex ? '<br><span class="k">Not on the scale:</span> ' + R.ex.toLocaleString() : ''), ev);
    }
    function show(html, ev) { var el = document.getElementById("tooltip"); el.innerHTML = html; el.style.display = "block"; var X = ev.clientX + 14, Y = ev.clientY + 14; if (X + el.offsetWidth > window.innerWidth - 4) X = ev.clientX - el.offsetWidth - 14; if (Y + el.offsetHeight > window.innerHeight - 4) Y = ev.clientY - el.offsetHeight - 14; el.style.left = Math.max(4, X) + "px"; el.style.top = Math.max(4, Y) + "px"; }
    function tip() { document.getElementById("tooltip").style.display = "none"; }

    function publish(f, meta) { S.sel = meta; omniscope.view.context().viewSelection = f ? { filter: f, meta: meta } : null; omniscope.view.updated(); draw(); }
    function select(meta) {
        var M = S.model, F = M.F; Object.keys(meta).forEach(function (k) { if (meta[k] === undefined) delete meta[k]; });
        if (S.sel && JSON.stringify(S.sel) === JSON.stringify(meta)) return publish(null, null);
        var fs = [], R = M.rows.find(function (x) { return x.q === meta.q && (meta.g === undefined || x.g === meta.g); });
        if (F.q) fs.push({ type: "FIELD_VALUE", inputField: F.q, operator: "=", value: R ? R.qraw : meta.q });
        if (F.g && meta.g !== undefined) fs.push({ type: "FIELD_VALUE", inputField: F.g, operator: "=", value: R ? R.graw : meta.g });
        if (meta.a !== undefined) fs.push({ type: "FIELD_VALUE", inputField: F.a, operator: "=", value: M.sc.kind === "numeric" || M.sc.kind === "nps" ? +meta.a : meta.a });
        if (!fs.length) return;
        publish(fs.length === 1 ? fs[0] : { type: "AND", filters: fs }, meta);
    }
    window.__lik.select = select;

    document.body.addEventListener("click", function () { if (S.sel) publish(null, null); omniscope.view.whitespaceClick(); });
    omniscope.view.on(["load", "update"], function () { message(null); load(); });
    omniscope.view.on("resize", function () { if (S.model) draw(); });
})();
